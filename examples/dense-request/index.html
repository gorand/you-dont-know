      // layout — otherwise it flashes once in its final state.
      frame(t0);
    }

    function locate(svg, id, hold) {
      const box = NODE_BOX[id];
      if (!box) return;
      const x = box.x - 6;
      const y = box.y - 6;
      const w = box.w + 12;
      const h = box.h + 12;
      const l = Math.min(14, w / 3, h / 3);
      const mark = document.createElementNS(svg.namespaceURI, "path");
      mark.setAttribute("class", hold ? "locator hold" : "locator");
      mark.setAttribute("aria-hidden", "true");
      mark.setAttribute("d", `M ${x} ${y + l} V ${y} H ${x + l} M ${x + w - l} ${y} H ${x + w} V ${y + l} `
        + `M ${x + w} ${y + h - l} V ${y + h} H ${x + w - l} M ${x + l} ${y + h} H ${x} V ${y + h - l}`);
      svg.append(mark);
      if (!hold) setTimeout(() => mark.remove(), 1900);
    }

    // The boxes as drawn, folded state included, for whatever a click or a
    // hover has to ask about the element it landed on.
    let VISIBLE = {};

    function renderFlow(highlight, step, keep) {
      const prevBox = NODE_BOX;
      const prevAnchor = ANCHOR_OF;
      hoverOutNow();
      const F = focusSet();
      const collapsed = collapsedSet(highlight, step, F);
      const graph = visibleGraph(collapsed);
      ANCHOR_OF = graph.anchorOf;
      const nodes = layoutNodes(graph.nodes, graph.edges);
      const pos = Object.fromEntries(nodes.map((n) => [n.id, n]));
      const edgesAll = graph.edges;
      const bands = rowBands(nodes);
      // A route is fine when it's short and local — e.g. two siblings in
      // one group — and keeping it there is what keeps it compact. It needs
      // the dedicated rail (see below) only when it would cut through some
      // OTHER node's body. Corridor routing keeps adjacent-rank edges clear
      // on its own, so what reaches the rail is what actually spans rows: a
      // long back-edge up a column, or a forward edge that skips ranks.
      const { plan, railX: railEnd } = routePlan(nodes, edgesAll, pos, bands);
      const { fromP, toP } = fanPorts(nodes, edgesAll, plan);
      alignPorts(nodes, edgesAll, pos, fromP, toP, plan);
      const { laneOf, countOf } = lanePlan(edgesAll, fromP, toP, pos, bands, plan);
      const hasBackRail = plan.some((r) => r && r.rail !== undefined);
      const maxX = Math.max(CELL * 26, ...nodes.map((n) => n.x + n.w + M.pad), hasBackRail ? railEnd + M.pad : 0);
      const maxY = Math.max(CELL * 15, ...nodes.map((n) => n.y + n.h + M.pad));
      const svg = $("flow");
      WORLD = { w: maxX, h: maxY };
      NODE_BOX = Object.fromEntries(nodes.map((n) => [n.id, { x: n.x, y: n.y, w: n.w, h: n.h }]));
      VISIBLE = pos;
      // A highlighted node that is currently folded away lights up the block
      // standing in for it, so no step ever points at nothing. In focus the
      // links take the step's place.
      const live = new Set((F ? [...F.lit] : (highlight || [])).map((id) => graph.anchorOf[id] || id));
      CURRENT.live = [...live];
      // An open fence around something lit is structure, not background.
      const dimmed = F
        ? new Set(nodes.filter((n) => !live.has(n.id) && !(isFence(n) && F.keep.has(n.id))).map((n) => n.id))
        : null;
      const marks = `<defs>
        <style>
          .node-label, .node-label .txt {
            color: var(--color-ink) !important;
            -webkit-text-fill-color: var(--color-ink) !important;
            font-family: "Onest", "Avenir Next", "Segoe UI", sans-serif;
          }
        </style>
        ${arrowMarkers()}
      </defs>`;
      const placed = [];
      const edgeEls = [];
      const labelEls = [];
      edgesAll.forEach((e, ei) => {
        const a = pos[e.from];
        const b = pos[e.to];
        if (!a || !b) return;
        const mid = e.via && pos[e.via];
        let d, lx, ly, vertical;
        if (mid) {
          const p = { x: a.x + a.w / 2, y: a.y + a.h };
          const q = { x: b.x + b.w / 2, y: b.y };
          const m = { x: mid.x + mid.w / 2, y: mid.y + mid.h / 2 };
          d = `M ${p.x} ${p.y} L ${m.x} ${m.y} L ${q.x} ${q.y}`;
          lx = m.x + 10; ly = m.y - 6; vertical = false;
        } else if (plan[ei] && plan[ei].rail !== undefined) {
          // Ports fanned like every other side: two edges out to the rail
          // from one box must not leave through the same point. A same-rank
          // sibling between the port and the rail sends the edge over its
          // own row instead — out of a top or bottom port, into a corridor
          // lane of its own.
          const p = fromP[ei] || pointOnSide(a, "right", 0, 1);
          const q = toP[ei] || pointOnSide(b, "right", 0, 1);
          const railX = plan[ei].rail;
          const sa = sideOf(a, p);
          const sb = sideOf(b, q);
          const cross = (port, side, id) => laneY(bands, port, { x: railX, y: port.y }, side,
            laneOf[id] || 0, countOf[id] || 1);
          const py = sa === "right" ? p.y : cross(p, sa, ei + ":from");
          const qy = sb === "right" ? q.y : cross(q, sb, ei + ":to");
          d = `M ${p.x} ${p.y}`;
          if (sa !== "right") d += ` L ${p.x} ${py}`;
          d += ` L ${railX} ${py} L ${railX} ${qy}`;
          if (sb !== "right") d += ` L ${q.x} ${qy}`;
          d += ` L ${q.x} ${q.y}`;
          lx = railX + 8; ly = (py + qy) / 2; vertical = true;
        } else {
          if (!fromP[ei] || !toP[ei]) return;
          ({ d, lx, ly, vertical } = orthoPath(a, b, fromP[ei], toP[ei], laneOf[ei] || 0, countOf[ei] || 1, bands, nodes));
        }
        // In focus an edge is lit when it carries one of the links, whatever
        // its ends are drawn as; otherwise when both of its ends are lit.
        const liveEdge = F ? e._raw.some((k) => F.raw.has(k)) : live.has(e.from) && live.has(e.to);
        const mk = edgeMarks(e, liveEdge);
        const raw = e._raw.join(" ");
        const dim = F && !liveEdge ? " dim" : "";
        const token = tokenMark(d, liveEdge, e.kind, raw);
        edgeEls.push(`<path class="edge-halo${dim}" data-raw="${raw}" d="${d}"></path><path class="${mk.cls}${dim}" data-raw="${raw}"${mk.start}${mk.end} d="${d}"></path>${token}`);
        if (e.label) {
          const y = nudgeLabel(lx, ly, e.label, placed, vertical, nodes);
          labelEls.push(`<text class="edge-label${liveEdge ? " live" : mk.tone ? ` tone-${mk.tone}` : ""}${dim}" data-raw="${raw}" x="${lx}" y="${y}" fill="#f4f2ee" text-anchor="${vertical ? "start" : "middle"}">${escapeHtml(e.label)}</text>`);
        }
      });
      // Only an EXPANDED fence splits into two passes (translucent shell
      // before the edges, caption after). A collapsed group is an ordinary
      // solid block and draws with the rest of them.
      const isDim = (n) => !!(dimmed && dimmed.has(n.id));
      const fences = nodes.filter((n) => isFence(n));
      const fenceShellEls = fences.map((n) => renderNode(n, live, "shell", isDim(n))).join("");
      const fenceLabelEls = fences.map((n) => renderNode(n, live, "content", isDim(n))).join("");
      const nodeEls = nodes.filter((n) => !isFence(n)).map((n) => renderNode(n, live, undefined, isDim(n))).join("");
      const oldEls = new Map();
      svg.querySelectorAll(".node[data-id]").forEach((el) => {
        const id = el.getAttribute("data-id");
        oldEls.set(id, (oldEls.get(id) || []).concat(el));
      });
      // Re-rendering replaces every box, and the one that had keyboard focus
      // would drop it to the page: the reader pressed L or Enter on a box and
      // is then nowhere. It goes back to the box with the same id.
      const had = document.activeElement && document.activeElement.closest && document.activeElement.closest("#flow .node[data-id]");
      const hadId = had && had.getAttribute("data-id");
      svg.innerHTML = marks + fenceShellEls + edgeEls.join("") + fenceLabelEls + nodeEls + labelEls.join("");
      svg.classList.toggle("focusing", !!F);
      animateRelayout(svg, prevBox, prevAnchor, graph.anchorOf, oldEls);
      svg.querySelectorAll(".node[role='button']").forEach((el) => {
        const id = el.getAttribute("data-id");
        // A folded block is a closed container first and a step link
        // second: activating it means "open this", not "jump somewhere
        // else". A box opens its step; an open fence's strip does its own
        // thing (defaultAction).
        const activate = () => runAction(id, defaultAction(VISIBLE[id]));
        el.addEventListener("click", (ev) => {
          if (ev.target.closest(".disclose, .act")) return;
          if (justDragged) return;
          activate();
        });
        el.addEventListener("keydown", (ev) => {
          if (ev.key !== "Enter" && ev.key !== " ") return;
          // Space would otherwise pan the page out from under the reader.
          ev.preventDefault();
          activate();
        });
        el.addEventListener("pointerenter", (ev) => { if (ev.pointerType !== "touch") hoverIn(id, el, false); });
        el.addEventListener("pointerleave", () => hoverOut());
        el.addEventListener("focus", () => { if (el.matches(":focus-visible")) hoverIn(id, el, true); });
        el.addEventListener("blur", () => hoverOut());
      });
      svg.querySelectorAll(".act").forEach((el) => {
        const id = el.getAttribute("data-for");
        const act = el.getAttribute("data-act");
        el.addEventListener("click", (ev) => {
          ev.stopPropagation();
          if (justDragged) return;
          runAction(id, act);
        });
        el.addEventListener("pointerenter", () => {
          showTip(el, act === "links"
            ? `<b>${escapeHtml(ui().links)}</b> · ${linksOf(id).raw.length}`
            : `<b>${pad(stepForNode(id))}</b> · ${escapeHtml(stepTitle(stepForNode(id)))}`);
          if (act === "links" && !focus) peek(id);
        });
        el.addEventListener("pointerleave", () => {
          hideTip();
          if (act === "links") unpeek();
        });
      });
      if (F) {
        const focal = graph.anchorOf[focus.id] || focus.id;
        if (NODE_BOX[focal]) locate(svg, focal, true);
      }
      if (hadId) {
        const back = svg.querySelector(`.node[role='button'][data-id="${CSS.escape(hadId)}"]`);
        if (back) back.focus({ preventScroll: true });
      }
      svg.querySelectorAll(".disclose").forEach((el) => {
        const toggle = (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          setCollapsed(el.getAttribute("data-group"), el.getAttribute("aria-expanded") === "true");
        };
        el.addEventListener("click", toggle);
        el.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") toggle(ev);
        });
      });
      syncDetailUi();
      syncFoldAll(collapsed);
      syncViewport([...live], keep);
      if (keep) locate(svg, keep);
    }

    function stepForNode(id) {
      const steps = LESSON.steps || [];
      const direct = steps.findIndex((s) => (s.highlight || []).includes(id));
      if (direct >= 0) return direct;
      const neigh = new Set();
      (LESSON.edges || []).forEach((e) => {
        if (e.from === id) neigh.add(e.to);
        if (e.to === id) neigh.add(e.from);
      });
      return steps.findIndex((s) => (s.highlight || []).some((h) => neigh.has(h)));
    }

    /* ---------- hover: what a click does, and what else ----------
       A click on an open group and a click on a box inside it used to share
       one rule, and nothing said which was about to happen. The group now
       answers on its strip only. Under the pointer a group — and a box that
       stands on its own — gets a panel with its step and its links; folding
       stays with the group's head and its disc. A box inside a group gets
       its actions as discs on its top border instead — the step a click
       opens, in the rail's own callout, and its links — and each disc names
       itself under the pointer. */
    const LINKS_ICO = '<path d="M2.5 5.5 H12.5"/><path d="M10 3 L12.5 5.5 L10 8"/><path d="M13.5 10.5 H3.5"/><path d="M6 8 L3.5 10.5 L6 13"/>';
    const DIR_ICO = {
      out: '<path d="M2.5 8 H13"/><path d="M9.5 4.5 L13 8 L9.5 11.5"/>',
      in: '<path d="M13.5 8 H3"/><path d="M6.5 4.5 L3 8 L6.5 11.5"/>',
      both: LINKS_ICO
    };
    let HOVER = null;
    let hoverHide = 0;
    let PEEK = null;

    function screenRect(box) {
      const v = viewRect();
      return { x: (box.x - v.x) * VIEW.s, y: (box.y - v.y) * VIEW.s, w: box.w * VIEW.s, h: box.h * VIEW.s };
    }

    // Over the element, or under it when there is no room above; the caret
    // stays on it when the panel has to slide along the edge. A group's head
    // never sends it down: under the head are the group's own boxes, and a
    // panel there takes the click meant for the first of them. It goes
    // beside the group instead.
    function placeFloat(el, r, ax, side) {
      const b = canvasBox();
      const w = el.offsetWidth;
      const h = el.offsetHeight;
      const gap = 10;
      let top = r.y - h - gap;
      let left = Math.max(8, Math.min(b.w - w - 8, ax - w / 2));
      let mode = top >= 8 ? "" : "below";
      if (mode && side) {
        const y = Math.max(8, Math.min(b.h - h - 8, r.y));
        if (side.x + side.w + gap + w <= b.w - 8) { mode = "side"; left = side.x + side.w + gap; top = y; }
        else if (side.x - gap - w >= 8) { mode = "side"; left = side.x - gap - w; top = y; }
      }
      if (mode === "below") top = r.y + r.h + gap;
      el.style.left = Math.round(left) + "px";
      el.style.top = Math.round(top) + "px";
      el.style.setProperty("--caret-x", Math.round(Math.max(12, Math.min(w - 12, ax - left))) + "px");
      el.classList.toggle("below", mode === "below");
      el.classList.toggle("side", mode === "side");
    }

    // A wide fence's strip is mostly empty, so the panel points at its caption.
    function anchorRect(id) {
      const n = VISIBLE[id];
      const box = NODE_BOX[id];
      if (!n || !box) return null;
      const fence = isFence(n);
      const r = screenRect(fence ? { ...box, h: M.groupHead } : box);
      return { r, ax: fence ? r.x + Math.min(r.w / 2, 150 * VIEW.s) : r.x + r.w / 2, side: fence ? screenRect(box) : null };
    }

    function placeHover() {
      if (!HOVER) return;
      const el = $("hoverbar");
      const a = anchorRect(HOVER.id);
      if (a && el.classList.contains("on")) placeFloat(el, a.r, a.ax, a.side);
    }

    // The step, then the links. Folding is not on the panel: a group's head
    // and its corner disc already fold it, and a third way to do it in the
    // panel only said the same thing again.
    function actionsFor(n) {
      return ["step", "links"].filter((a) => a === "step" ? stepForNode(n.id) >= 0 : linksOf(n.id).raw.length > 0);
    }

    // The step reads as one: the word, the rail's numbered callout and the
    // title, all of it the button.
    function barButton(n, act, main) {
      const t = ui();
      if (act === "step") {
        const si = stepForNode(n.id);
        const num = `<span class="hb-n${si === i ? " now" : ""}">${pad(si)}</span>`;
        const name = `${t.step} ${pad(si)} · ${stepTitle(si)}`;
        return `<button type="button" class="main" data-act="step" title="${escapeHtml(name)}" aria-label="${escapeHtml(name)}"><span class="hb-click">${t.step}</span>${num}<span class="t">${escapeHtml(stepTitle(si))}</span></button>`;
      }
      const c = linksOf(n.id).raw.length;
      const name = `${t.links} · ${c} (L)`;
      return `<button type="button"${main ? ' class="main"' : ""} data-act="links" title="${escapeHtml(name)}" aria-label="${escapeHtml(name)}">${ico(LINKS_ICO)}${main ? `<span class="t">${t.links}</span>` : ""}<span>${c}</span></button>`;
    }

    function showBar(id) {
      const n = VISIBLE[id];
      if (!n || !HOVER || HOVER.id !== id) return;
      const bar = $("hoverbar");
      const acts = actionsFor(n);
      bar.innerHTML = acts.map((a, k) => barButton(n, a, k === 0) + (k === 0 && acts.length > 1 ? '<span class="sep" aria-hidden="true"></span>' : "")).join("");
      bar.querySelectorAll("[data-act]").forEach((b) => {
        const act = b.getAttribute("data-act");
        b.onclick = (ev) => { ev.stopPropagation(); runAction(id, act); };
        if (act === "links") {
          b.onpointerenter = () => { if (!focus) peek(id); };
          b.onpointerleave = () => unpeek();
        }
      });
      bar.classList.add("on");
      placeHover();
    }

    function hoverIn(id, el, byKey) {
      clearTimeout(hoverHide);
      if (HOVER && HOVER.id === id) return;
      hoverOutNow();
      HOVER = { id, timer: 0, shell: null };
      // The fence's dashed border lives in the other render pass.
      const shell = $("flow").querySelector(`.node[aria-hidden="true"][data-id="${CSS.escape(id)}"]`);
      if (shell) { shell.classList.add("hot"); HOVER.shell = shell; }
      // A box inside a group needs nothing more: its discs come in with the
      // hover, and each names itself when the pointer reaches it.
      if (usesPanel(VISIBLE[id])) HOVER.timer = setTimeout(() => showBar(id), byKey ? 0 : 90);
    }

    // A short grace, so the pointer can cross from the box onto a disc or
    // up to its panel.
    function hoverOut() {
      clearTimeout(hoverHide);
      hoverHide = setTimeout(hoverOutNow, 160);
    }

    function hoverOutNow() {
      clearTimeout(hoverHide);
      if (!HOVER) return;
      clearTimeout(HOVER.timer);
      if (HOVER.shell) HOVER.shell.classList.remove("hot");
      HOVER = null;
      $("hoverbar").classList.remove("on");
      hideTip();
      unpeek();
    }

    function showTip(target, html) {
      const tip = $("tip");
      tip.innerHTML = html;
      tip.classList.add("on");
      const c = $("canvas").getBoundingClientRect();
      const r = target.getBoundingClientRect();
      const w = tip.offsetWidth;
      const h = tip.offsetHeight;
      const left = Math.max(8, Math.min(c.width - w - 8, r.left - c.left + r.width / 2 - w / 2));
      let top = r.top - c.top - h - 6;
      if (top < 8) top = r.bottom - c.top + 6;
      tip.style.left = Math.round(left) + "px";
      tip.style.top = Math.round(top) + "px";
    }

    function hideTip() { $("tip").classList.remove("on"); }

    // The links of one box, previewed in place: no fold opens, nothing moves.
    // A partner folded away lights the block that holds it.
    function peek(id) {
      unpeek();
      const f = linksOf(id);
      if (!f.raw.length) return;
      const svg = $("flow");
      const raw = new Set(f.raw);
      const ends = new Set([id, ...f.partners]);
      (LESSON.edges || []).forEach((e, k) => {
        if (!raw.has(k)) return;
        if (f.own.has(e.from)) ends.add(e.from);
        if (f.own.has(e.to)) ends.add(e.to);
      });
      const lit = new Set([...ends].map((x) => ANCHOR_OF[x] || x));
      const keep = new Set();
      ends.forEach((x) => ancestors(x).forEach((g) => keep.add(g)));
      svg.classList.add("peeking");
      svg.querySelectorAll("[data-raw]").forEach((el) => {
        const hit = el.getAttribute("data-raw").split(" ").some((k) => raw.has(Number(k)));
        el.classList.add(hit ? "peek" : "peek-dim");
        if (hit && el.matches("path.edge") && !el.classList.contains("live")) {
          const g = document.createElementNS(svg.namespaceURI, "g");
          g.setAttribute("class", "peek-token");
          g.innerHTML = tokenMark(el.getAttribute("d"), true, el.hasAttribute("marker-start") ? "both" : "flow");
          el.after(g);
        }
      });
      svg.querySelectorAll(".node[data-id]").forEach((el) => {
        const nid = el.getAttribute("data-id");
        if (lit.has(nid)) el.classList.add("peek");
        else if (!keep.has(nid)) el.classList.add("peek-dim");
      });
      PEEK = { id };
    }

    function unpeek() {
      if (!PEEK) return;
      const svg = $("flow");
      svg.classList.remove("peeking");
      svg.querySelectorAll(".peek, .peek-dim").forEach((el) => el.classList.remove("peek", "peek-dim"));
      svg.querySelectorAll(".peek-token").forEach((el) => el.remove());
      PEEK = null;
    }

    /* ---------- focus: the bar on the canvas and the dock ---------- */
    function renderFocusUi() {
      const t = ui();
      const bar = $("focusbar");
      if (!focus) { bar.hidden = true; return; }
      const n = nodeIndex()[focus.id];
      const label = (n && n.label) || focus.id;
      renderRich($("fb-name"), label);
      $("fb-links").textContent = t.links;
      $("fb-path").textContent = t.path;
      $("fb-links").setAttribute("aria-pressed", String(focus.mode === "links"));
      $("fb-path").setAttribute("aria-pressed", String(focus.mode === "path"));
      $("fb-close").title = t.leave;
      $("fb-close").setAttribute("aria-label", t.leave);
      bar.setAttribute("aria-label", `${t.links} — ${String(label).replace(/`/g, "")}`);
      bar.hidden = false;
      renderFocusDock();
    }

    function pick(raw) {
      const svg = $("flow");
      svg.querySelectorAll(".pick").forEach((el) => el.classList.remove("pick"));
      svg.classList.toggle("picking", !!raw);
      if (!raw) return;
      const want = new Set(String(raw).split(" "));
      svg.querySelectorAll("[data-raw]").forEach((el) => {
        if (el.getAttribute("data-raw").split(" ").some((k) => want.has(k))) el.classList.add("pick");
      });
    }

    // The dock says the same thing in words: one row per partner, with every
    // link to it on that row, so a pair that runs both ways reads as one
    // exchange — POST out, 201 back — rather than two unrelated arrows.
    function renderFocusDock() {
      const t = ui();
      const by = nodeIndex();
      const n = by[focus.id];
      const edges = LESSON.edges || [];
      $("dock-n").innerHTML = `<svg viewBox="0 0 16 16" aria-hidden="true">${LINKS_ICO}</svg>`;
      renderRich($("dock-title"), (n && n.label) || focus.id);
      $("code").classList.remove("on");
      $("dock").classList.add("no-code");
      const narr = $("narration");
      const name = (id) => escapeHtml(String((by[id] && by[id].label) || id).replace(/`/g, ""));
      let html = "";
      if (focus.mode === "links") {
        const f = linksOf(focus.id);
        const rows = new Map();
        f.raw.forEach((k) => {
          const e = edges[k];
          const out = f.own.has(e.from);
          const other = out ? e.to : e.from;
          if (!rows.has(other)) rows.set(other, []);
          rows.get(other).push({ k, dir: edgeDir(e) === "both" ? "both" : out ? "out" : "in", label: e.label || "" });
        });
        html = `<p class="links-meta">${f.raw.length
          ? `${f.raw.length} ${plural(f.raw.length, t.linkWord)} · ${rows.size} ${plural(rows.size, t.boxWord)}`
          : t.noLinks}</p><ul class="links">`;
        rows.forEach((list, other) => {
          const lks = list.map((l) => `<span class="lk" data-raw="${l.k}">${ico(DIR_ICO[l.dir])}${l.label ? `<span class="lb">${escapeHtml(l.label)}</span>` : ""}</span>`).join("");
          html += `<li><button type="button" class="link-row" data-to="${escapeHtml(other)}" data-raw="${list.map((l) => l.k).join(" ")}"><span class="nm">${name(other)}</span><span class="lks">${lks}</span></button></li>`;
        });
        html += "</ul>";
      } else {
        const p = pathOf(focus.id);
        const chips = (set) => [...set].map((id) => `<button type="button" class="link-row" data-to="${escapeHtml(id)}"><span class="nm">${name(id)}</span></button>`).join("");
        html = `<p class="links-meta">${t.up}: ${p.up.size} · ${t.down}: ${p.down.size}</p>`
          + (p.up.size ? `<div class="links"><h4>${t.up}</h4><div class="chips">${chips(p.up)}</div></div>` : "")
          + (p.down.size ? `<div class="links"><h4>${t.down}</h4><div class="chips">${chips(p.down)}</div></div>` : "");
      }
      narr.innerHTML = html;
      narr.querySelectorAll(".link-row").forEach((row) => {
        row.onclick = () => startFocus(row.getAttribute("data-to"), focus ? focus.mode : "links");
        if (row.hasAttribute("data-raw")) {
          row.onpointerenter = () => pick(row.getAttribute("data-raw"));
          row.onpointerleave = () => pick(null);
          row.onfocus = () => pick(row.getAttribute("data-raw"));
          row.onblur = () => pick(null);
        }
        row.querySelectorAll(".lk").forEach((lk) => {
          lk.onpointerenter = () => pick(lk.getAttribute("data-raw"));
          lk.onpointerleave = () => pick(row.getAttribute("data-raw"));
        });
      });
      narr.scrollTop = 0;
      syncDockFit();
    }

    // The step's own text in the dock.
    function renderDock(step) {
      if (!step) return;
      $("dock-n").textContent = pad(i);
      renderRich($("dock-title"), step.title || "");
      renderRich($("narration"), step.narration || "");
      const file = (step.code && step.code.file) || "";
      const start = step.code && step.code.startLine ? `:${step.code.startLine}` : "";
      // A step with no excerpt drops the code block rather than showing an
      // empty one — the dock is only as tall as it has something to say.
      const hasCode = !!(step.code && step.code.text);
      $("code").classList.toggle("on", hasCode);
      $("dock").classList.toggle("no-code", !hasCode);
      $("code-file").textContent = file + start;
      renderCode((step.code && step.code.text) || "", step.code && step.code.startLine);
      syncDockFit();
    }

    function show(index) {
      const steps = LESSON.steps || [];
      if (!steps.length) return;
      closePop();
      endFocus(false);
      i = (index + steps.length) % steps.length;
      const step = steps[i];
      $("counter").textContent = `${i + 1} / ${steps.length}`;
      $("prev").disabled = i === 0 && !timer;
      $("next").disabled = i === steps.length - 1 && !timer;
      renderDock(step);
      [...document.querySelectorAll(".step")].forEach((btn, idx) => {
        if (idx === i) btn.setAttribute("aria-current", "true");
        else btn.removeAttribute("aria-current");
      });
      if (step !== CURRENT.step) foldedAt = null;
      CURRENT = { highlight: step.highlight || [], step, live: CURRENT.live };
      renderFlow(step.highlight || [], step);
    }

    function play() {
      if (timer) {
        clearInterval(timer);
        timer = null;
        setPlay(false);
        show(i);
        return;
      }
      setPlay(true);
      $("prev").disabled = false;
      $("next").disabled = false;
      timer = setInterval(() => show(i + 1), 2400);
    }

    function boot() {
      if (!LESSON || typeof LESSON !== "object") {
        document.body.innerHTML = "<p>LESSON JSON was not injected (__LESSON_JSON__).</p>";
        return;
      }
      const t = ui();
      document.documentElement.lang = String(LESSON.lang || "en").slice(0, 2);
      $("lbl-back").textContent = t.back;
      $("lbl-next").textContent = t.next;
      // role="img" with no name announces as an unlabelled graphic.
      $("flow").setAttribute("aria-label", `${String(LESSON.title || "").replace(/`/g, "")} — ${t.stage}`);
      $("lbl-problem").textContent = t.problem;
      $("lbl-why").textContent = t.why;
      $("lbl-cost").textContent = t.cost;
      $("lbl-brief").textContent = t.brief;
      $("brief-close").setAttribute("aria-label", t.briefClose);
      $("brief-close").title = t.briefClose;
      $("steps").setAttribute("aria-label", t.steps);
      applyKindTone(LESSON.kind, LESSON.accent);
      // An unlisted kind still gets named — the shell says what the JSON
      // said rather than pretending the lesson has no type.
      $("kind").textContent = LESSON.kind ? (t.kinds[LESSON.kind] || LESSON.kind) : "";
      $("dzen").onclick = () => setDzen(!dzen);
      $("panel").onclick = () => setPanel(!panelOpen, true);
      syncChrome();
      setPlay(false);
      renderRich($("pattern"), LESSON.pattern || "Lesson");
      renderRich($("title"), LESSON.title || "Lesson");
      document.title = (LESSON.title || "You Don't Know").replace(/`/g, "");
      renderRich($("thesis"), LESSON.thesis || "");
      renderRich($("brief-title"), LESSON.title || "Lesson");
      renderRich($("thesis-full"), LESSON.thesis || "");
      renderParas($("problem"), LESSON.problem);
      renderParas($("whyNotBasic"), LESSON.whyNotBasic);
      renderParas($("cost"), LESSON.cost);
      const repeats = LESSON.repeats || [];
      if (repeats.length) {
        $("repeats-wrap").hidden = false;
        renderRich($("repeats"), "Также здесь: " + repeats.map((r) => `${r.module} (${r.file}) — ${r.note}`).join(" · "));
      }
      $("steps").innerHTML = (LESSON.steps || []).map((s, idx) =>
        `<button class="step" type="button" data-i="${idx}"><span class="n">${pad(idx)}</span><span class="t"></span></button>`
      ).join("");
      [...$("steps").querySelectorAll(".step")].forEach((btn, idx) => {
        renderRich(btn.querySelector(".t"), (LESSON.steps[idx] && LESSON.steps[idx].title) || "");
      });
      $("steps").addEventListener("click", (ev) => {
        const btn = ev.target.closest("[data-i]");
        if (btn) show(Number(btn.dataset.i));
      });
      const dlg = $("brief-dlg");
      $("brief").onclick = () => { closePop(); dlg.showModal(); };
      $("brief-close").onclick = () => dlg.close();
      // Clicking the backdrop closes it — the dialog element itself fills
      // only the panel, so a click whose target IS the dialog is outside it.
      dlg.addEventListener("click", (ev) => { if (ev.target === dlg) dlg.close(); });
      // Esc with an aside open closes the aside, not the whole brief.
      dlg.addEventListener("cancel", (ev) => {
        if (!$("pop").hidden) { ev.preventDefault(); closePop(); }
      });
      dlg.addEventListener("close", closePop);
      // The hairline under the head appears once text has gone under it. A
      // fixed pop would stay put while its button scrolls away, so it closes,
      // as it does on resize.
      dlg.addEventListener("scroll", () => {
        $("brief-top").classList.toggle("lifted", dlg.scrollTop > 0);
        closePop();
      });
      $("play").onclick = play;
      $("prev").onclick = () => show(i - 1);
      $("next").onclick = () => show(i + 1);
      document.addEventListener("click", (ev) => {
        const pop = $("pop");
        if (pop.hidden) return;
        if (pop.contains(ev.target) || ev.target.closest(".fn")) return;
        closePop();
      });
      document.addEventListener("keydown", (ev) => {
        // The brief is modal: while it is open the canvas keys are not the
        // reader's context, and Esc belongs to the dialog.
        if (document.querySelector("dialog[open]")) return;
        if (ev.key === "Escape") {
          if (!$("pop").hidden) { ev.preventDefault(); closePop(); }
          else if (focus) { ev.preventDefault(); endFocus(true); }
          else if (!$("fold-all").hidden) { ev.preventDefault(); foldAll(); }
          return;
        }
        // L: the links of the box under the pointer or under keyboard focus,
        // and again to leave. By key code, so it works in any layout.
        if (ev.code === "KeyL" && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
          const el = ev.target.closest && ev.target.closest("#flow .node[data-id]");
          const id = (HOVER && HOVER.id) || (el && el.getAttribute("data-id")) || null;
          if (id) { ev.preventDefault(); toggleFocus(id); }
          else if (focus) { ev.preventDefault(); endFocus(true); }
          return;
        }
        // Figma-side of the keyboard. `+ / - / 0 / 1 / 2` work bare and with
        // Ctrl/⌘, so the muscle memory from either app lands somewhere sane.
        if (ev.key === "+" || ev.key === "=") { ev.preventDefault(); zoomBy(1.25); return; }
        if (ev.key === "-" || ev.key === "_") { ev.preventDefault(); zoomBy(0.8); return; }
        if (ev.key === "0") { ev.preventDefault(); fitAll(true); return; }
        if (ev.key === "1") {
          ev.preventDefault();
          setView({ cx: VIEW.cx, cy: VIEW.cy, s: 1 }, true);
          viewPinned = true;
          return;
        }
        if (ev.key === "2") { ev.preventDefault(); focusLive(true); return; }
        // A focused control owns Space: a button presses, a node opens its
        // step. Taking it here for play swallowed both.
        if (ev.key === " " && ev.target.closest("button, [role='button']")) return;
        if (ev.key === " ") { ev.preventDefault(); play(); }
        if (ev.key === "ArrowRight") show(i + 1);
        if (ev.key === "ArrowLeft") show(i - 1);
      });
      window.addEventListener("resize", () => { closePop(); applyView(); });

      // --- canvas: pan · zoom · detail ---
      const canvas = $("canvas");
      $("hint").innerHTML = t.hint;
      $("zoom-in").title = t.zoomIn;
      $("zoom-out").title = t.zoomOut;
      $("zoom-pct").title = t.zoomReset;
      $("zoom-fit").title = t.fit;
      $("zoom-step").title = t.focus;
      $("zoom-in").onclick = () => zoomBy(1.25);
      $("zoom-out").onclick = () => zoomBy(0.8);
      $("zoom-pct").onclick = () => { setView({ cx: VIEW.cx, cy: VIEW.cy, s: 1 }, true); viewPinned = true; };
      $("zoom-fit").onclick = () => fitAll(true);
      $("zoom-step").onclick = () => focusLive(true);
      $("detail").onclick = () => {
        endFocus(false);
        detailMode = detailMode === null ? "full" : (detailMode === "full" ? "step" : null);
        collapseOverride.clear(); // the switch speaks for the whole canvas again
        foldedAt = null;
        renderFlow(CURRENT.highlight, CURRENT.step);
      };
      $("fold-all").onclick = foldAll;
      $("fb-links").onclick = () => setFocusMode("links");
      $("fb-path").onclick = () => setFocusMode("path");
      $("fb-close").onclick = () => endFocus(true);
      $("hoverbar").addEventListener("pointerenter", () => clearTimeout(hoverHide));
      $("hoverbar").addEventListener("pointerleave", () => hoverOut());

      canvas.addEventListener("wheel", (ev) => {
        ev.preventDefault();
        const unit = ev.deltaMode === 1 ? 16 : 1;
        // Trackpad pinch arrives as a ctrlKey wheel — same branch as ⌘/Ctrl.
        if (ev.ctrlKey || ev.metaKey) {
          zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * unit * 0.0022));
          return;
        }
        if (ev.shiftKey) panBy((ev.deltaY || ev.deltaX) * unit, 0);
        else panBy(ev.deltaX * unit, ev.deltaY * unit);
      }, { passive: false });

      const pointers = new Map();
      let drag = null;
      let pinch = null;
      // Touch has no hover to offer a second action on, so holding a box
      // shows its links; the click that ends the hold is swallowed.
      let press = 0;
      const pinchState = () => {
        const [a, b] = [...pointers.values()];
        return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      };
      canvas.addEventListener("pointerdown", (ev) => {
        justDragged = false;
        clearTimeout(press);
        if (ev.pointerType === "mouse" && ev.button !== 0 && ev.button !== 1) return;
        const held = ev.pointerType === "touch" && ev.target.closest && ev.target.closest("#flow .node[role='button']");
        if (held) {
          const id = held.getAttribute("data-id");
          press = setTimeout(() => { justDragged = true; toggleFocus(id); }, 520);
        }
        pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
        if (pointers.size === 2) { clearTimeout(press); drag = null; pinch = pinchState(); return; }
        if (pointers.size > 2) return;
        // No pointer capture yet: capturing here would retarget the click and
        // kill every node tap. It is claimed only once this becomes a drag.
        drag = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, moved: false };
      });
      canvas.addEventListener("pointermove", (ev) => {
        if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
        if (pinch && pointers.size >= 2) {
          const now = pinchState();
          if (pinch.d > 0) zoomAt(now.x, now.y, now.d / pinch.d);
          panBy(-(now.x - pinch.x), -(now.y - pinch.y));
          pinch = now;
          return;
        }
        if (!drag || ev.pointerId !== drag.id) return;
        const dx = ev.clientX - drag.x;
        const dy = ev.clientY - drag.y;
        if (!drag.moved) {
          if (Math.abs(dx) + Math.abs(dy) < 4) return;
          clearTimeout(press);
          drag.moved = true;
          justDragged = true;
          canvas.classList.add("panning");
          try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* pointer already gone */ }
        }
        drag.x = ev.clientX;
        drag.y = ev.clientY;
        panBy(-dx, -dy);
      });
      const endPointer = (ev) => {
        clearTimeout(press);
        pointers.delete(ev.pointerId);
        if (pointers.size < 2) pinch = null;
        if (!drag || drag.id !== ev.pointerId) return;
        if (drag.moved) {
          canvas.classList.remove("panning");
          try { canvas.releasePointerCapture(ev.pointerId); } catch (e) { /* not captured */ }
        }
        drag = null;
      };
      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);
      // A drag that ends over a node must not also open that node's step.
      canvas.addEventListener("click", (ev) => {
        if (!justDragged) return;
        ev.stopPropagation();
        ev.preventDefault();
        justDragged = false;
      }, true);
      canvas.addEventListener("dblclick", (ev) => {
        if (ev.target.closest(".node")) return;
        fitAll(true);
      });
      // A click on empty canvas lets go of the links, as it would of a
      // selection anywhere else.
      canvas.addEventListener("click", (ev) => {
        if (!focus || justDragged) return;
        if (ev.target.closest(".node[role='button'], .act, .disclose, .zoombar, .focusbar, .hoverbar")) return;
        endFocus(true);
      });
      if (window.ResizeObserver) {
        // Re-frame, don't blind-fit: on a narrow canvas fitting the whole
        // graph is exactly what makes it unreadable.
        new ResizeObserver(() => {
          // A cap that fit the old window may not fit this one.
          if (dockCap != null) applyDockCap(dockFull ? Infinity : dockCap, false);
          syncDockFit();
          if (viewPinned) applyView(); else autoFrame(false);
        }).observe(canvas);
      }
      wireDockGrip();

      show(0);
      // The webfonts land after the first step is measured, and change it.
      if (document.fonts) document.fonts.ready.then(syncDockFit);
    }

    boot();
  </script>
</body>
</html>
