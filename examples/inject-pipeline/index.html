    function renderCode(text, startLine) {
      const body = $("code-body");
      body.textContent = "";
      const lines = String(text || "").replace(/\n$/, "").split("\n");
      const base = Number(startLine) || 1;
      const state = { block: false };
      lines.forEach((line, idx) => {
        const row = document.createElement("div");
        row.className = "line";
        const ln = document.createElement("span");
        ln.className = "ln";
        ln.textContent = String(base + idx);
        const lt = document.createElement("span");
        lt.className = "lt";
        highlightLine(line, state).forEach(([kind, chunk]) => {
          if (kind === "p" || kind === "id") {
            lt.append(chunk);
            return;
          }
          const span = document.createElement("span");
          span.className = "tok-" + kind;
          span.textContent = chunk;
          lt.append(span);
        });
        if (!line) lt.append(" ");
        row.append(ln, lt);
        body.append(row);
      });
    }

    function syncChrome() {
      const t = ui();
      document.body.classList.toggle("dzen", dzen);
      document.body.classList.toggle("no-inspector", !panelOpen);
      const d = $("dzen");
      d.setAttribute("aria-pressed", dzen ? "true" : "false");
      d.setAttribute("aria-label", dzen ? t.dzenOff : t.dzen);
      d.title = dzen ? t.dzenOff : t.dzen;
      const p = $("panel");
      p.setAttribute("aria-pressed", panelOpen ? "true" : "false");
      p.setAttribute("aria-label", t.panel);
      p.title = t.panel;
    }

    function setPanel(open, byReader) {
      panelOpen = open;
      // Touching the panel by hand inside Dzen replaces the snapshot: the
      // reader has said what they want, so leaving Dzen must not undo it.
      if (byReader && dzen) preDzen = null;
      syncChrome();
    }

    function setDzen(on) {
      if (on === dzen) return;
      if (on) {
        preDzen = { panel: panelOpen };
        dzen = true;
        panelOpen = false;
      } else {
        dzen = false;
        if (preDzen) panelOpen = preDzen.panel;
        preDzen = null;
      }
      syncChrome();
    }

    function setPlay(playing) {
      const t = ui();
      $("play").innerHTML = playing
        ? `${ico('<rect x="4" y="3.5" width="2.6" height="9" rx="0.4"/><rect x="9.4" y="3.5" width="2.6" height="9" rx="0.4"/>')}<span>${t.pause}</span>`
        : `${ico('<path class="fill" d="M5 3.2 L12.5 8 L5 12.8 Z"/>')}<span>${t.play}</span>`;
    }

    function isChain(nodes, edges) {
      if (nodes.length < 2 || edges.length !== nodes.length - 1) return false;
      const ids = new Set(nodes.map((n) => n.id));
      const out = Object.fromEntries(nodes.map((n) => [n.id, 0]));
      const inn = Object.fromEntries(nodes.map((n) => [n.id, 0]));
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        if (!ids.has(e.from) || !ids.has(e.to) || e.from === e.to) return false;
        out[e.from] += 1;
        inn[e.to] += 1;
      }
      const sources = nodes.filter((n) => inn[n.id] === 0);
      const sinks = nodes.filter((n) => out[n.id] === 0);
      if (sources.length !== 1 || sinks.length !== 1) return false;
      return nodes.every((n) => out[n.id] <= 1 && inn[n.id] <= 1);
    }

    /* ---------- one spacing grid ----------
       Every box, gap and pad below is a whole number of CELL, and the canvas
       paints a line every CELL with a heavier one every MAJOR. Before this
       the drawn grid was 24px while the layout ran on 40 / 52 / 104 / 16 —
       the lines described nothing, and a same-row arrow got 40px of run,
       less than the label it had to carry. The unit IS the layout now: a
       horizontal edge always has six cells to be read in, and every node
       edge lands on a drawn line.
    */
    const CELL = 16;
    const MAJOR = CELL * 4;
    const M = {
      pad: CELL * 2,          // 32  canvas margin
      nodeW: CELL * 12,       // 192
      nodeH: CELL * 4,        // 64
      colGap: CELL * 6,       // 96  room for a horizontal edge label
      rowGap: CELL * 7,       // 112 the corridor every horizontal run lives in
      childGapX: CELL * 3,    // 48
      childGapY: CELL * 3,    // 48  a group's rows leave a corridor too
      groupPadX: CELL * 2,    // 32
      groupHead: CELL * 3,    // 48  fence caption band
      groupFoot: CELL * 2,    // 32
      unitGap: CELL * 2,      // 32
      rankGap: CELL * 6,      // 96  two stacked edge labels fit
      maxRowW: CELL * 60,     // 960
      timelineW: CELL * 18,   // 288
      timelineGap: CELL * 3,  // 48
      treeW: CELL * 15,       // 240
      treeH: CELL * 3,        // 48
      treeGap: CELL,          // 16
      indent: CELL * 2        // 32
    };
    const snap = (v) => Math.round(v / CELL) * CELL;

    // A collapsed group stands for everything inside it, so it outweighs a
    // leaf node on purpose: the top level of a staged diagram should read as
    // a few large shapes, not as more of the same boxes.
    const COLLAPSED_GROW_W = CELL * 3;
    const COLLAPSED_GROW_H = CELL * 2;
    function unitW(n, boxW) { return n._collapsed ? boxW + COLLAPSED_GROW_W : boxW; }
    function unitH(n, boxH) { return n._collapsed ? boxH + COLLAPSED_GROW_H : boxH; }

    function placeRow(row, li, boxW, boxH, gapX, gapY, padY, canvasW) {
      const ws = row.map((n) => unitW(n, boxW));
      const hs = row.map((n) => unitH(n, boxH));
      const rowH = Math.max(...hs);
      const rowW = ws.reduce((a, b) => a + b, 0) + Math.max(0, row.length - 1) * gapX;
      const y0 = padY + li * (boxH + gapY);
      let x = Math.max(M.pad, snap((canvasW - rowW) / 2));
      return row.map((n, idx) => {
        const box = { ...n, x, y: y0 + snap((rowH - hs[idx]) / 2), w: ws[idx], h: hs[idx] };
        x += ws[idx] + gapX;
        return box;
      });
    }

    function layoutTimeline(nodes) {
      const boxW = M.timelineW, boxH = M.nodeH, gapY = M.timelineGap, pad = M.pad, x = CELL * 3;
      return nodes.map((n, idx) => ({ ...n, x, y: pad + idx * (boxH + gapY), w: boxW, h: boxH }));
    }

    function layoutGrouped(nodes, keyFn) {
      const groups = new Map();
      nodes.forEach((n) => {
        const L = keyFn(n);
        if (!groups.has(L)) groups.set(L, []);
        groups.get(L).push(n);
      });
      const boxW = M.nodeW, boxH = M.nodeH, gapX = M.colGap, gapY = M.rowGap, padY = M.pad;
      const layers = [...groups.keys()].sort((a, b) => a - b);
      const widest = Math.max(1, ...layers.map((L) =>
        groups.get(L).reduce((sum, n) => sum + unitW(n, boxW) + gapX, -gapX)));
      const width = M.pad * 2 + widest;
      return layers.flatMap((L, li) => placeRow(groups.get(L), li, boxW, boxH, gapX, gapY, padY, width));
    }

    function layoutLayers(nodes) {
      const LAYER = {
        provider: 0, host: 0, cloud: 0,
        frame: 1, hoc: 1,
        process: 1, other: 1, start: 1, queue: 1, subroutine: 1,
        inbox: 2, consumer: 2, action: 2, decision: 2,
        child: 3, file: 3, folder: 3, boundary: 3, group: 0, junction: 2
      };
      return layoutGrouped(nodes, (n) => LAYER[n.kind] ?? 1);
    }

    function layoutRanked(nodes) {
      return layoutGrouped(nodes, (n) => Number(n.rank));
    }

    function computeRank(nodes, edges) {
      const ids = new Set(nodes.map((n) => n.id));
      const incoming = Object.fromEntries(nodes.map((n) => [n.id, 0]));
      const outs = Object.fromEntries(nodes.map((n) => [n.id, []]));
      const backIn = Object.fromEntries(nodes.map((n) => [n.id, []]));
      edges.forEach((e) => {
        if (!ids.has(e.from) || !ids.has(e.to)) return;
        if (e.kind === "back") { // a loop-back, not a rank dependency — counting it drags its target to the bottom of the layout
          backIn[e.to].push(e.from);
          return;
        }
        incoming[e.to] += 1;
        outs[e.from].push(e.to);
      });
      const indeg = { ...incoming };
      const rank = Object.fromEntries(nodes.map((n) => [n.id, 0]));
      const queue = nodes.filter((n) => incoming[n.id] === 0).map((n) => n.id);
      const seen = new Set();
      const drain = () => {
        while (queue.length) {
          const id = queue.shift();
          if (seen.has(id)) continue;
          seen.add(id);
          (outs[id] || []).forEach((to) => {
            rank[to] = Math.max(rank[to], rank[id] + 1);
            incoming[to] -= 1;
            if (incoming[to] === 0) queue.push(to);
          });
        }
      };
      drain();
      // Kahn's pass stalls on a cycle and leaves every node behind it at
      // rank 0 — which reads as "this belongs in the first row". Folding a
      // group makes that easy to hit: two nodes that merely exchange edges
      // (a service writing to storage, storage's row coming back) collapse
      // into one A⇄B pair that no topological order can resolve. Break the
      // cycle at whatever node has the fewest unmet dependencies left and
      // keep ranking, so the rest of the diagram still lands in flow order.
      while (seen.size < nodes.length) {
        const stuck = nodes.filter((n) => !seen.has(n.id));
        if (!stuck.length) break;
        // Fewest unmet dependencies first, then the node that already sits
        // FURTHEST along the flow. Releasing the shallowest one instead
        // (rank ascending) hands rank 0 to a node the whole graph feeds
        // into: in the dense example the storage group got released before
        // the service that writes to it, so storage — and everything
        // downstream of it — was hoisted above the request that starts the
        // lesson.
        stuck.sort((a, b) => (incoming[a.id] - incoming[b.id]) || (rank[b.id] - rank[a.id]));
        queue.push(stuck[0].id);
        drain();
      }
      // A node reached ONLY by back-edges got no rank from the pass above and
      // kept the default 0 — the top row, as if the flow started there. A
      // dead-letter queue hanging off a consumer did exactly that, and since
      // a group unit takes the LOWEST rank among its children, it hoisted the
      // whole async tail above the request that produces it. Park such a node
      // level with whatever loops back into it instead.
      let lifted = true;
      let passes = 0;
      while (lifted && passes++ < nodes.length) {
        lifted = false;
        nodes.forEach((n) => {
          if (indeg[n.id] > 0 || !backIn[n.id].length) return;
          const r = Math.max(...backIn[n.id].map((id) => rank[id] || 0));
          if (r > rank[n.id]) { rank[n.id] = r; lifted = true; }
        });
      }
      return { rank, indeg };
    }

    function layoutDag(nodes, edges) {
      const { rank, indeg } = computeRank(nodes, edges);
      const ordered = [...nodes].sort((a, b) => {
        const d = (rank[a.id] || 0) - (rank[b.id] || 0);
        if (d) return d;
        return (indeg[b.id] || 0) - (indeg[a.id] || 0);
      });
      return layoutGrouped(ordered, (n) => rank[n.id] || 0);
    }

    function layoutTree(nodes) {
      const kids = Object.fromEntries(nodes.map((n) => [n.id, []]));
      const roots = [];
      nodes.forEach((n) => {
        if (n.parent && kids[n.parent]) kids[n.parent].push(n);
        else roots.push(n);
      });
      const boxW = M.treeW, boxH = M.treeH, gapY = M.treeGap, indent = M.indent, pad = M.pad;
      const out = [];
      let y = pad;
      function walk(n, depth) {
        out.push({ ...n, x: pad + depth * indent, y, w: boxW, h: boxH });
        y += boxH + gapY;
        (kids[n.id] || []).forEach((c) => walk(c, depth + 1));
      }
      roots.forEach((r) => walk(r, 0));
      return out;
    }

    function layoutContainers(nodes, edges) {
      // A grouped child can sit mid-chain in the runtime flow (e.g. a file
      // that's also a pipeline step). Rank the WHOLE graph first, then place
      // each group as one unit (at its lowest-ranked child) alongside plain
      // nodes in the same rank row — otherwise groups always land above every
      // ungrouped node regardless of where they actually belong in the flow,
      // and edges routed through a grouped child silently drop out of the
      // ungrouped nodes' own rank computation (two DAGs that don't know about
      // each other → nodes stranded far from their logical position).
      // A COLLAPSED group has no visible children — it is a plain block in
      // the flow, so only expanded fences claim container slots here.
      const groupIds = new Set(nodes.filter((n) => isFence(n)).map((n) => n.id));
      const kids = {};
      groupIds.forEach((id) => { kids[id] = []; });
      const outer = [];
      nodes.forEach((n) => {
        if (isFence(n)) return;
        if (n.parent && groupIds.has(n.parent)) kids[n.parent].push(n);
        else outer.push(n);
      });

      const { rank: fullRank } = computeRank(nodes, edges);
      const boxW = M.nodeW, boxH = M.nodeH, gapX = M.childGapX, gapY = M.childGapY;
      const padX = M.groupPadX, padY = M.groupHead;
      const outerW = M.nodeW, outerH = M.nodeH;
      const maxRowW = M.maxRowW, unitGap = M.unitGap;

      function groupBox(list) {
        const folderish = list.length && list.every((k) => k.kind === "folder" || k.kind === "file");
        const cols = folderish ? 1 : Math.min(3, Math.max(1, list.length));
        const rows = Math.max(1, Math.ceil(list.length / cols) || 1);
        return {
          cols,
          w: padX * 2 + cols * boxW + Math.max(0, cols - 1) * gapX,
          h: padY + rows * boxH + Math.max(0, rows - 1) * gapY + M.groupFoot
        };
      }

      const units = [];
      nodes.filter((n) => isFence(n)).forEach((g) => {
        const list = kids[g.id] || [];
        const box = groupBox(list);
        const childRanks = list.map((k) => fullRank[k.id] || 0);
        units.push({ kind: "group", node: g, w: box.w, h: box.h, rank: childRanks.length ? Math.min(...childRanks) : (fullRank[g.id] || 0) });
      });
      outer.forEach((n) => {
        units.push({ kind: "outer", node: n, w: unitW(n, outerW), h: unitH(n, outerH), rank: fullRank[n.id] || 0 });
      });

      const byRank = new Map();
      units.forEach((u) => {
        if (!byRank.has(u.rank)) byRank.set(u.rank, []);
        byRank.get(u.rank).push(u);
      });
      const ranksSorted = [...byRank.keys()].sort((a, b) => a - b);

      const placed = [];
      let y = M.pad;
      ranksSorted.forEach((r) => {
        let x = M.pad, subRowH = 0;
        byRank.get(r).forEach((u) => {
          if (x > M.pad && x + u.w > maxRowW) {
            x = M.pad;
            y += subRowH + unitGap;
            subRowH = 0;
          }
          if (u.kind === "outer") {
            placed.push({ ...u.node, x, y, w: u.w, h: u.h });
          } else {
            const g = u.node;
            placed.push({ ...g, x, y, w: u.w, h: u.h });
            const list = kids[g.id] || [];
            const { cols } = groupBox(list);
            list.forEach((k, i) => {
              const col = i % cols, row = Math.floor(i / cols);
              placed.push({
                ...k,
                x: x + padX + col * (boxW + gapX),
                y: y + padY + row * (boxH + gapY),
                w: boxW,
                h: boxH
              });
            });
          }
          x += u.w + unitGap;
          subRowH = Math.max(subRowH, u.h);
        });
        // The gap between ranks is the corridor every horizontal edge run
        // is routed into (see channelY), so it has to hold two stacked
        // labels — a node branching valid/invalid needs both.
        y += subRowH + M.rankGap;
      });
      return placed;
    }

    function layoutNodes(nodes, edges) {
      const mode = LESSON.layout || "auto";
      const treeish = nodes.length && nodes.every((n) => n.kind === "folder" || n.kind === "file");
      if (mode === "tree" || (mode === "auto" && treeish)) return layoutTree(nodes);
      if (nodes.some((n) => isFence(n))) return layoutContainers(nodes, edges);
      if (mode === "timeline" || (mode === "auto" && isChain(nodes, edges))) return layoutTimeline(nodes);
      if (nodes.some((n) => Number.isFinite(n.rank))) return layoutRanked(nodes);
      if (mode === "layers") return layoutLayers(nodes);
      return layoutDag(nodes, edges);
    }

    function center(n) { return { x: n.x + n.w / 2, y: n.y + n.h / 2 }; }

    function edgeCardinal(from, to) {
      const a = center(from);
      const b = center(to);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const splitRow = Math.abs(from.y - to.y) > Math.min(from.h, to.h) * 0.5;
      if (splitRow) return dy > 0 ? "bottom" : "top";
      if (Math.abs(dx) > Math.abs(dy) * 1.15) return dx > 0 ? "right" : "left";
      return dy > 0 ? "bottom" : "top";
    }

    // Ports sit on cell CENTRES, never on a cell line. Every box edge is on a
    // line, so this guarantees each run keeps half a cell of clearance from
    // every border instead of grazing one — the arrows that used to look
    // like they were drawn along the boxes rather than between them.
    function portOn(lo, hi, t) {
      const mid = Math.floor((lo + (hi - lo) * t) / CELL) * CELL + CELL / 2;
      return Math.min(hi - CELL / 2, Math.max(lo + CELL / 2, mid));
    }

    function pointOnSide(n, side, k, count) {
      const t = count <= 1 ? 0.5 : (k + 1) / (count + 1);
      if (side === "bottom") return { x: portOn(n.x, n.x + n.w, t), y: n.y + n.h };
      if (side === "top") return { x: portOn(n.x, n.x + n.w, t), y: n.y };
      if (side === "right") return { x: n.x + n.w, y: portOn(n.y, n.y + n.h, t) };
      return { x: n.x, y: portOn(n.y, n.y + n.h, t) };
    }

    function fanPorts(nodes, edges, plan) {
      const pos = Object.fromEntries(nodes.map((n) => [n.id, n]));
      const buckets = {};
      const add = (id, side, item) => {
        const key = id + "\t" + side;
        if (!buckets[key]) buckets[key] = [];
        buckets[key].push(item);
      };
      edges.forEach((e, i) => {
        if (e.via) return;
        // An edge bound for the rail is fanned on the side it actually
        // leaves through, not the one it would have used. Keeping its old
        // slot pushed the edges that DID stay off their centre — which is
        // how two boxes in one column ended up joined by a stair — and two
        // rail edges touching one box used to leave through the very same
        // point.
        const rt = (plan && plan[i]) || null;
        const a = pos[e.from];
        const b = pos[e.to];
        if (!a || !b) return;
        add(e.from, (rt && rt.sideFrom) || edgeCardinal(a, b), { i, other: b, end: "from" });
        add(e.to, (rt && rt.sideTo) || edgeCardinal(b, a), { i, other: a, end: "to" });
      });
      const fromP = [];
      const toP = [];
      Object.keys(buckets).forEach((key) => {
        const tab = key.indexOf("\t");
        const n = pos[key.slice(0, tab)];
        const side = key.slice(tab + 1);
        const list = buckets[key];
        const horiz = side === "top" || side === "bottom";
        list.sort((A, B) => (horiz ? A.other.x - B.other.x : A.other.y - B.other.y));
        // Snapping to cell centres can land two ports of a crowded side on
        // the same centre; push the later one along by a whole cell so they
        // stay one cell apart rather than exactly on top of each other.
        const used = new Set();
        const span = horiz ? n.w : n.h;
        list.forEach((item, k) => {
          const pt = pointOnSide(n, side, k, list.length);
          let v = horiz ? pt.x : pt.y;
          const lo = (horiz ? n.x : n.y) + CELL / 2;
          const hi = lo + Math.max(0, span - CELL);
          while (used.has(v) && v + CELL <= hi) v += CELL;
          while (used.has(v) && v - CELL >= lo) v -= CELL;
          used.add(v);
          if (horiz) pt.x = v; else pt.y = v;
          if (item.end === "from") fromP[item.i] = pt;
          else toP[item.i] = pt;
        });
      });
      return { fromP, toP };
    }

    /* ---------- corridors ----------
       Rows of nodes leave horizontal corridors between them, and that is
       where every horizontal edge run belongs. The old router put the run
       at a fraction of the WHOLE vertical distance, so an edge crossing
       three ranks laid its horizontal segment straight across the middle
       row's nodes — the "arrows run along the boxes" problem. Bands are
       computed from the finished layout, not assumed, so this holds for
       every layout mode.
    */
    function rowBands(nodes) {
      const solid = nodes.filter((n) => !isFence(n));
      if (!solid.length) return [];
      const sorted = [...solid].sort((a, b) => a.y - b.y);
      const bands = [];
      sorted.forEach((n) => {
        const last = bands[bands.length - 1];
        // Overlapping vertically means the same row, however ragged.
        if (last && n.y < last.y1 - 1) last.y1 = Math.max(last.y1, n.y + n.h);
        else bands.push({ y0: n.y, y1: n.y + n.h });
      });
      return bands;
    }

    function bandIndex(bands, y) {
      for (let i = 0; i < bands.length; i++) {
        if (y >= bands[i].y0 - 1 && y <= bands[i].y1 + 1) return i;
      }
      return -1;
    }

    // The empty strip between the source's row and the next one along the
    // way. Every horizontal run is placed inside it, so it can never cross
    // a node body.
    function corridor(bands, fromY, toY) {
      const down = toY >= fromY;
      const i = bandIndex(bands, fromY);
      if (i < 0) return { y0: Math.min(fromY, toY), y1: Math.max(fromY, toY) };
      const here = bands[i];
      const next = down ? bands[i + 1] : bands[i - 1];
      const edge = down ? here.y1 : here.y0;
      const far = next ? (down ? next.y0 : next.y1) : toY;
      return { y0: Math.min(edge, far), y1: Math.max(edge, far), key: down ? i : i - 1 };
    }

    // Which side of its box a finished port sits on. Routing reads this
    // instead of guessing from the two centres: the old router picked the
    // shape of the route from the dx/dy ratio, so a pair of top/bottom ports
    // could end up with a horizontal run laid at the port's own y — which IS
    // the box's border line, and reads as an arrow glued to the row.
    function sideOf(n, p) {
      if (Math.abs(p.y - n.y) < 0.5) return "top";
      if (Math.abs(p.y - (n.y + n.h)) < 0.5) return "bottom";
      if (Math.abs(p.x - n.x) < 0.5) return "left";
      return "right";
    }

    // Cell centres inside a strip, kept a whole cell clear of the rows on
    // either side. A run PARALLEL to a row needs more room than a port stub
    // does: at half a cell it still reads as attached to the boxes it passes.
    // Narrow strips fall back to the half-cell the ports use.
    function cellSlots(lo, hi) {
      const at = (pad) => {
        const out = [];
        let v = Math.ceil((lo + pad - CELL / 2) / CELL) * CELL + CELL / 2;
        while (v <= hi - pad + 0.01) { out.push(v); v += CELL; }
        return out;
      };
      const wide = at(CELL);
      return wide.length ? wide : at(CELL / 2);
    }

    // A hop leaves and lands on the SAME side of the same row, so its strip
    // is the one that side faces, not the one between the two ports.
    function runCorridor(bands, p, q, sa) {
      const toY = Math.abs(p.y - q.y) < 0.5 ? (sa === "top" ? p.y - 1 : p.y + 1) : q.y;
      return corridor(bands, p.y, toY);
    }

    // The strip an edge uses to get over its own row on the way to the rail.
    function crossKey(bands, port, side) {
      return runCorridor(bands, port, { x: port.x, y: port.y }, side).key;
    }

    // A horizontal run belongs on a cell centre inside its corridor, never at
    // a fraction of it: with three edges in a 48px strip the old fractions
    // put the outer two 12px off the boxes they pass, which reads as glued.
    function laneY(bands, p, q, sa, lane, laneCount) {
      const strip = runCorridor(bands, p, q, sa);
      const slots = cellSlots(strip.y0, strip.y1);
      if (laneCount > slots.length) {
        // More edges than clean lines: share the strip evenly instead, still
        // keeping the half cell off both rows that a port keeps.
        const lo = strip.y0 + CELL / 2;
        const hi = strip.y1 - CELL / 2;
        if (hi <= lo) return Math.round((strip.y0 + strip.y1) / 2);
        return Math.round(lo + (hi - lo) * (lane + 1) / (laneCount + 1));
      }
      const step = Math.floor(slots.length / laneCount) || 1;
      const first = Math.floor((slots.length - 1 - step * (laneCount - 1)) / 2);
      return slots[Math.max(0, Math.min(slots.length - 1, first + lane * step))];
    }

    // An edge that only touches one side of a corridor takes its lane from
    // that side: 0 when it drops in from the row above, 2 when it comes up
    // from the row below, 1 for the ones that cross the whole strip.
    function rankOf(side, single) {
      if (!single) return 1;
      return side === "bottom" ? 0 : 2;
    }

    // Lanes are per corridor, not global: two edges sharing a strip must
    // sit at different heights, but an edge three rows down has its own
    // strip and should not be pushed off-centre by them.
    function lanePlan(edges, fromP, toP, pos, bands, plan) {
      const byKey = new Map();
      const items = [];
      edges.forEach((e, i) => {
        const a = pos[e.from], b = pos[e.to];
        if (!a || !b || !fromP[i] || !toP[i]) return;
        const rt = (plan && plan[i]) || null;
        if (rt && rt.rail !== undefined) {
          // A rail edge that has to get over its own row crosses it in a
          // corridor, and there it competes for lanes with every ordinary
          // run in that strip — count it, or the two land on one line.
          const sa = sideOf(a, fromP[i]);
          const sb = sideOf(b, toP[i]);
          if (sa !== "right") items.push({ id: i + ":from", key: crossKey(bands, fromP[i], sa), x: fromP[i].x, rank: rankOf(sa, true) });
          if (sb !== "right") items.push({ id: i + ":to", key: crossKey(bands, toP[i], sb), x: toP[i].x, rank: rankOf(sb, true) });
          return;
        }
        const sa = sideOf(a, fromP[i]);
        // An edge that stays inside its row never enters a corridor — unless
        // it is hopping over a sibling, and then it needs a lane like the
        // rest of them.
        if (sa !== "top" && sa !== "bottom") return;
        items.push({
          id: i,
          key: runCorridor(bands, fromP[i], toP[i], sa).key,
          x: fromP[i].x,
          rank: rankOf(sa, !!(rt && rt.hop))
        });
      });
      // Lane order decides where the two stubs of an edge end up, and two
      // stubs at the same x overlap unless the one dropping in from the row
      // above gets the higher line. So: everything that only reaches DOWN
      // into the strip first, edges that cross it whole next, everything that
      // only reaches UP into it last.
      items.sort((A, B) => (A.rank - B.rank) || (A.x - B.x));
      const laneOf = {};
      const countOf = {};
      items.forEach((it) => {
        const list = byKey.get(it.key) || [];
        laneOf[it.id] = list.length;
        list.push(it.id);
        byKey.set(it.key, list);
      });
      items.forEach((it) => { countOf[it.id] = (byKey.get(it.key) || []).length; });
      return { laneOf, countOf };
    }

    function pathSegments(d) {
      const nums = (d.match(/-?\d+(\.\d+)?/g) || []).map(Number);
      const pts = [];
      for (let i = 0; i < nums.length; i += 2) pts.push({ x: nums[i], y: nums[i + 1] });
      const segs = [];
      for (let i = 0; i < pts.length - 1; i++) segs.push([pts[i], pts[i + 1]]);
      return segs;
    }

    function pathBlocked(nodes, excludeIds, d) {
      // Does this (axis-aligned) edge path cut through the BODY of some
      // node it isn't connected to? A back-edge's default orthoPath route
      // often does — same x as several intervening nodes in a column draws
      // one line straight through all of them. A short local back-edge
      // between two adjacent nodes (e.g. two siblings in one group) usually
      // doesn't and should keep its normal, compact route rather than
      // detour to the rail unconditionally.
      return pathSegments(d).some(([p, q]) => nodes.some((o) => {
        // A group's own fence is a translucent container, not an obstacle —
        // edges legitimately cross it to reach a nested child (that's what
        // the group-label z-order fix above is for). Only concrete content
        // nodes count as something a route needs to avoid.
        if (excludeIds.has(o.id) || isFence(o)) return false;
        if (Math.abs(p.y - q.y) < 0.5) {
          const lo = Math.min(p.x, q.x), hi = Math.max(p.x, q.x);
          return p.y > o.y + 1 && p.y < o.y + o.h - 1 && hi > o.x && lo < o.x + o.w;
        }
        if (Math.abs(p.x - q.x) < 0.5) {
          const lo = Math.min(p.y, q.y), hi = Math.max(p.y, q.y);
          return p.x > o.x + 1 && p.x < o.x + o.w - 1 && hi > o.y && lo < o.y + o.h;
        }
        return false;
      }));
    }

    function railClear(nodes, self, x0, x1, y) {
      // Is the horizontal strip [x0,x1] at height y free of every OTHER
      // node? A same-rank sibling sitting between a back-edge's port and
      // its rail (e.g. two nodes side by side in one row) would otherwise
      // get cut through the middle by that straight approach line.
      const lo = Math.min(x0, x1), hi = Math.max(x0, x1);
      return !nodes.some((o) => o.id !== self.id && y > o.y && y < o.y + o.h && hi > o.x && lo < o.x + o.w);
    }

    // Does the segment come within `pad` of a box? Liang-Barsky against the
    // inflated rect — used to decide whether a diagonal is clean or is
    // scraping something on its way.
    function segHitsBox(p, q, o, pad) {
      const dx = q.x - p.x, dy = q.y - p.y;
      const tests = [
        [-dx, p.x - (o.x - pad)], [dx, (o.x + o.w + pad) - p.x],
        [-dy, p.y - (o.y - pad)], [dy, (o.y + o.h + pad) - p.y]
      ];
      let t0 = 0, t1 = 1;
      for (const [pp, qq] of tests) {
        if (Math.abs(pp) < 1e-9) { if (qq < 0) return false; continue; }
        const r = qq / pp;
        if (pp < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
        else { if (r < t0) return false; if (r < t1) t1 = r; }
      }
      return true;
    }

    // One slanted line beats a stair when the two ports are nearly in one
    // column: the eye reads a single run instead of three. Offered only for a
    // small residual offset — the route still reads as vertical — and only
    // when the line keeps half a cell clear of every other box. A diagonal
    // that scrapes a corner, or one flat enough to be mistaken for a run
    // along a row, falls back to the orthogonal route.
    function diagonalOk(a, b, p, q, nodes) {
      const dx = Math.abs(p.x - q.x);
      const dy = Math.abs(p.y - q.y);
      if (dx < 1.5 || dx > CELL * 2 || dy < CELL * 2 || dx > dy) return false;
      return !(nodes || []).some((o) =>
        o.id !== a.id && o.id !== b.id && !isFence(o) && segHitsBox(p, q, o, CELL / 2));
    }

    // Two boxes stacked in one column deserve one straight line, not a stair
    // with a 16px jog in it. Every port already sits on a cell centre of its
    // own side, so an edge whose ends face each other across a corridor is
    // usually one cell away from straight: pull both ends onto a shared
    // centre when the boxes overlap there, the slot is free on both sides,
    // and the straight run is clear of everything else.
    function alignPorts(nodes, edges, pos, fromP, toP, plan) {
      const taken = new Map();
      const key = (id, side) => id + "\t" + side;
      const hold = (id, side, v) => {
        const k = key(id, side);
        if (!taken.has(k)) taken.set(k, new Set());
        taken.get(k).add(v);
      };
      const vert = (side) => side === "top" || side === "bottom";
      const list = [];
      edges.forEach((e, i) => {
        if (e.via) return;
        const a = pos[e.from], b = pos[e.to];
        if (!a || !b || !fromP[i] || !toP[i]) return;
        const sa = sideOf(a, fromP[i]);
        const sb = sideOf(b, toP[i]);
        hold(a.id, sa, vert(sa) ? fromP[i].x : fromP[i].y);
        hold(b.id, sb, vert(sb) ? toP[i].x : toP[i].y);
        // A rail edge keeps its ports but is never straightened: it goes the
        // long way round on purpose.
        if (plan && plan[i] && plan[i].rail !== undefined) return;
        if (vert(sa) !== vert(sb)) return; // an elbow: nothing to line up
        list.push({ i, a, b, sa, sb, v: vert(sa) });
      });
      const off = (it) => it.v
        ? Math.abs(fromP[it.i].x - toP[it.i].x)
        : Math.abs(fromP[it.i].y - toP[it.i].y);
      // Nearest to straight first, so the easy wins take the shared centre
      // before an edge that would have to drag it far off its own port.
      list.sort((A, B) => off(A) - off(B));
      list.forEach((it) => {
        const p = fromP[it.i], q = toP[it.i];
        const V = it.v;
        const pv = V ? p.x : p.y;
        const qv = V ? q.x : q.y;
        if (Math.abs(pv - qv) < 1.5) return;
        const lo = Math.max(V ? it.a.x : it.a.y, V ? it.b.x : it.b.y) + CELL / 2;
        const hi = Math.min(V ? it.a.x + it.a.w : it.a.y + it.a.h,
                            V ? it.b.x + it.b.w : it.b.y + it.b.h) - CELL / 2;
        if (lo > hi) return; // the boxes do not overlap: no straight run exists
        const want = (pv + qv) / 2;
        const base = Math.min(hi, Math.max(lo, Math.floor(want / CELL) * CELL + CELL / 2));
        for (let step = 0; step <= 4; step++) {
          for (const dir of (step ? [-1, 1] : [0])) {
            const v = base + dir * step * CELL;
            if (v < lo - 0.01 || v > hi + 0.01) continue;
            if (v !== pv && taken.get(key(it.a.id, it.sa)).has(v)) continue;
            if (v !== qv && taken.get(key(it.b.id, it.sb)).has(v)) continue;
            const s0 = V ? `${v} ${p.y}` : `${p.x} ${v}`;
            const s1 = V ? `${v} ${q.y}` : `${q.x} ${v}`;
            if (pathBlocked(nodes, new Set([it.a.id, it.b.id]), `M ${s0} L ${s1}`)) continue;
            taken.get(key(it.a.id, it.sa)).delete(pv);
            taken.get(key(it.b.id, it.sb)).delete(qv);
            taken.get(key(it.a.id, it.sa)).add(v);
            taken.get(key(it.b.id, it.sb)).add(v);
            if (V) { p.x = v; q.x = v; } else { p.y = v; q.y = v; }
            return;
          }
        }
      });
    }

    // The shape of a route follows the SIDES its two ports sit on, not the
    // ratio between the two centres. Reading it off dx/dy is what used to lay
    // a horizontal run at a top/bottom port's own y — i.e. exactly along the
    // border of every box in that row.
    function orthoPath(a, b, p, q, lane, laneCount, bands, nodes) {
      const sa = sideOf(a, p);
      const sb = sideOf(b, q);
      const va = sa === "top" || sa === "bottom";
      const vb = sb === "top" || sb === "bottom";
      if (va !== vb) {
        // One end leaves through a face, the other arrives through a side:
        // one elbow, and neither leg can run along the box it starts on.
        const c = va ? { x: p.x, y: q.y } : { x: q.x, y: p.y };
        return {
          d: `M ${p.x} ${p.y} L ${c.x} ${c.y} L ${q.x} ${q.y}`,
          lx: va ? p.x + 10 : (p.x + q.x) / 2,
          ly: va ? (p.y + c.y) / 2 + 3 : p.y - 10,
          vertical: va
        };
      }
      if (va) {
        if (Math.abs(p.x - q.x) < 1.5) {
          return { d: `M ${p.x} ${p.y} L ${q.x} ${q.y}`, lx: p.x + 10, ly: (p.y + q.y) / 2 + 3, vertical: true };
        }
        if (diagonalOk(a, b, p, q, nodes)) {
          return {
            d: `M ${p.x} ${p.y} L ${q.x} ${q.y}`,
            lx: (p.x + q.x) / 2 + 10,
            ly: (p.y + q.y) / 2 + 3,
            vertical: true
          };
        }
        const midY = laneY(bands || [], p, q, sa, lane, laneCount);
        return {
          d: `M ${p.x} ${p.y} L ${p.x} ${midY} L ${q.x} ${midY} L ${q.x} ${q.y}`,
          lx: p.x + 10,
          ly: (p.y + midY) / 2 + 3,
          vertical: true
        };
      }
      if (Math.abs(p.y - q.y) < 1.5) {
        return { d: `M ${p.x} ${p.y} L ${q.x} ${q.y}`, lx: (p.x + q.x) / 2, ly: p.y - 10, vertical: false };
      }
      const midX = Math.floor((p.x + q.x) / 2 / CELL) * CELL + CELL / 2;
      return {
        d: `M ${p.x} ${p.y} L ${midX} ${p.y} L ${midX} ${q.y} L ${q.x} ${q.y}`,
        lx: midX + 10,
        ly: (p.y + q.y) / 2 + 3,
        vertical: true
      };
    }

    /* ---------- route plan ----------
       Two passes, because what an edge does changes where its ports belong.
       The first lays every edge out naively and finds the ones that cannot go
       the direct way: a same-row edge with a sibling in between (it hops over
       the row instead) and a run that would cut through a box (it leaves for
       the right-hand rail). The second fan then places the ports knowing all
       of that, so an edge on the rail no longer holds a slot on a side it
       never uses, and the edges that stayed keep their centres.
    */
    // Which side an edge leaves through on its way to the rail. Straight out
    // the right when nothing is in the way; otherwise over the row through a
    // corridor — and then through the roomier of the two, since the strip
    // above a row is often one lane wide while the one below is empty. It
    // used to slide up the box's own right border instead, which drew the
    // arrow along the shape it was leaving.
    function railSide(nodes, bands, n, railX) {
      const port = pointOnSide(n, "right", 0, 1);
      if (railClear(nodes, n, port.x, railX, port.y)) return "right";
      const up = corridor(bands, n.y, n.y - 1);
      const down = corridor(bands, n.y + n.h, n.y + n.h + 1);
      return cellSlots(down.y0, down.y1).length > cellSlots(up.y0, up.y1).length ? "bottom" : "top";
    }

    function routePlan(nodes, edges, pos, bands) {
      const plan = edges.map(() => ({}));
      const { fromP, toP } = fanPorts(nodes, edges, null);
      const { laneOf, countOf } = lanePlan(edges, fromP, toP, pos, bands, null);
      let railX = Math.max(0, ...nodes.map((n) => n.x + n.w)) + CELL * 3;
      edges.forEach((e, ei) => {
        if (e.via) return;
        const a = pos[e.from], b = pos[e.to];
        if (!a || !b || !fromP[ei] || !toP[ei]) return;
        const p = fromP[ei], q = toP[ei];
        const own = new Set([a.id, b.id]);
        const natural = orthoPath(a, b, p, q, laneOf[ei] || 0, countOf[ei] || 1, bands, nodes);
        if (!pathBlocked(nodes, own, natural.d)) return;
        const sa = sideOf(a, p);
        if (sa === "left" || sa === "right") {
          // Same row with something in between: go over the row through the
          // corridor rather than all the way out to the rail — the hop stays
          // local and keeps the two boxes visibly connected.
          const side = bandIndex(bands, p.y) > 0 ? "top" : "bottom";
          const hop = orthoPath(a, b, pointOnSide(a, side, 0, 1), pointOnSide(b, side, 0, 1), 0, 1, bands, nodes);
          if (!pathBlocked(nodes, own, hop.d)) {
            plan[ei] = { sideFrom: side, sideTo: side, hop: true };
            return;
          }
        }
        plan[ei] = { rail: railX, sideFrom: railSide(nodes, bands, a, railX), sideTo: railSide(nodes, bands, b, railX) };
        railX += CELL * 2;
      });
      return { plan, railX };
    }

    function nudgeLabel(x, y, text, placed, anchorStart, nodes) {
      const w = Math.min(150, 6.2 * String(text).length + 8);
      const h = 16;
      // `x` is the SVG anchor point, not a box center — "start"-anchored
      // labels (vertical edges) draw rightward from it, "middle"-anchored
      // ones (horizontal edges) straddle it. The old check treated every
      // label as centered on `x`, so two "start"-anchored labels close in x
      // (e.g. two edges fanned out of the same node, like "невалидно" /
      // "валидно" off `validate`) under-counted their true overlap and
      // could clear the y-test by a couple px while still overlapping.
      const x0 = anchorStart ? x : x - w / 2;
      // A label was only ever moved out of another LABEL's way, so one could
      // still land on top of a node — most visibly inside a group, where the
      // corridors are short. Boxes now push it too. Fences are skipped: they
      // are transparent containers, and dodging one would shove every label
      // out of the group it belongs to.
      const overBox = (ly) => (nodes || []).some((o) => !isFence(o)
        && x0 < o.x + o.w + 2 && o.x < x0 + w + 2
        && ly + h / 2 > o.y && ly - h / 2 < o.y + o.h);
      let ly = y;
      let guard = 0;
      while (guard++ < 8) {
        const hit = placed.some((p) => x0 < p.x0 + p.w + 4 && p.x0 < x0 + w + 4 && Math.abs(p.y - ly) < (p.h + h) / 2)
          || overBox(ly);
        if (!hit) break;
        ly += h;
      }
      placed.push({ x0, y: ly, w, h });
      return ly;
    }

    function nodeShell(n) {
      const { x, y, w, h } = n;
      const k = kindOf(n);
      if (k === "group" && n._collapsed) {
        // Ghost card behind the block: the one static cue that this shape is
        // a stack of things, not a leaf.
        return `<rect class="node-stack" x="${x + CELL / 2}" y="${y - CELL / 2}" width="${w - CELL / 2}" height="${h}" rx="2"/>`
          + `<rect class="node-shell" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>`;
      }
      if (k === "group") {
        return `<rect class="node-shell" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>`;
      }
      if (k === "start" || k === "queue" || k === "cloud") {
        return `<rect class="node-shell" x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(h / 2, 22)}"/>`;
      }
      if (k === "junction") {
        const rr = Math.min(w, h) / 2 - 2;
        return `<circle class="node-shell" cx="${x + w / 2}" cy="${y + h / 2}" r="${rr}"/>`;
      }
      return `<rect class="node-shell" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>`;
    }

    function discloseMark(n) {
      if (!n._kids) return "";
      const t = ui();
      const open = !n._collapsed;
      const bw = 32, bh = 18;
      const x = n.x + n.w - bw - 6;
      const y = open ? n.y + 6 : n.y + (n.h - bh) / 2;
      const cy = y + bh / 2;
      const chev = open
        ? `M ${x + 19} ${cy + 2.4} L ${x + 22.5} ${cy - 2.2} L ${x + 26} ${cy + 2.4}`
        : `M ${x + 19} ${cy - 2.4} L ${x + 22.5} ${cy + 2.2} L ${x + 26} ${cy - 2.4}`;
      const name = `${open ? t.collapse : t.expand} — ${n.label || n.id} (${n._kids})`;
      return `<g class="disclose" data-group="${escapeHtml(n.id)}" role="button" tabindex="0"
          aria-expanded="${open}" aria-label="${escapeHtml(name)}">
        <rect class="disclose-bg" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="9"/>
        <text class="disclose-n" x="${x + 10}" y="${cy + 0.5}" text-anchor="middle">${n._kids}</text>
        <path class="disclose-mark" d="${chev}"/>
      </g>`;
    }

    function renderNode(n, live, part) {
      const on = live.has(n.id) ? "on" : "";
      const k = kindOf(n);
      const group = k === "group" && !n._collapsed;
      const icoY = group ? n.y + 8 : n.y + (n.h - 16) / 2;
      const foY = group ? n.y + 2 : n.y;
      const foH = group ? 50 : n.h;
      const badge = discloseMark(n);
      const labelW = Math.max(24, n.w - 30 - (badge ? 40 : 0));
      const label = n.label
        ? `<foreignObject x="${n.x + 26}" y="${foY}" width="${labelW}" height="${foH}" color="#f4f2ee">
            <div xmlns="http://www.w3.org/1999/xhtml" class="node-label" style="color:#f4f2ee;-webkit-text-fill-color:#f4f2ee"><span class="txt">${escapeHtml(n.label)}</span></div>
          </foreignObject>`
        : "";
      // A group's fence rect draws BEFORE edges (its translucent fill would
      // otherwise wash out any child node placed on top of it), but its
      // icon+label must draw AFTER edges like every other node's — otherwise
      // an edge merely passing through the group on its way to a nested
      // child paints directly over the group's own caption text. `part`
      // splits the two: "shell" for the early pass, "content" for the late
      // one; omitted (ordinary nodes) renders both together as before.
      const shellHtml = part === "content" ? "" : nodeShell(n);
      const contentHtml = part === "shell" ? "" : `
        <svg class="node-ico" x="${n.x + 8}" y="${icoY}" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">${glyph(k)}</svg>
        ${label}
        <rect class="hit" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" fill="transparent"></rect>
        ${badge}`;
      return `<g class="node ${on}${n._collapsed ? " collapsed" : ""} kind-${escapeHtml(k)}" data-id="${n.id}">
        ${shellHtml}
        ${contentHtml}
      </g>`;
    }

    function edgeMarks(e, liveEdge) {
      const ek = e.kind || "flow";
      const live = liveEdge ? " live" : "";
      const dash = ek === "dashed" ? " dashed" : "";
      const tip = liveEdge ? "arrow-live" : "arrow";
      const start = (ek === "back" || ek === "both") ? ` marker-start="url(#${tip}-rev)"` : "";
      const end = ek === "back" ? "" : ` marker-end="url(#${tip})"`;
      return { cls: `edge${live}${dash}`, start, end };
    }

    /* ---------- viewport: pan + zoom ----------
       Figma keys: Ctrl/⌘ + wheel zooms at the cursor, Shift + wheel pans
       sideways, a plain wheel pans, dragging empty canvas moves it. The
       graph keeps its own world coordinates and only the viewBox moves, so
       nothing re-lays-out and labels stay vector-crisp at any scale.

       `viewPinned` is the whole contract with the reader: until they touch
       the canvas the diagram keeps auto-fitting exactly as it always did.
       Once they zoom or pan, their frame is theirs — the shell then only
       nudges it when the current step's nodes would otherwise sit off
       screen, and never zooms further in than where they left it.
    */
    const ZOOM_MIN = 0.15;
    const ZOOM_MAX = 4;
    const VIEW = { cx: 320, cy: 180, s: 1 };
    let WORLD = { w: 640, h: 360 };
    let NODE_BOX = {};
    let viewReady = false;
    let viewPinned = false;
    let viewAnim = 0;

    const r2 = (v) => Math.round(v * 100) / 100;

    function canvasBox() {
      const r = $("canvas").getBoundingClientRect();
      return { w: Math.max(1, r.width), h: Math.max(1, r.height), left: r.left, top: r.top };
    }

    function clampScale(v) { return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, v)); }

    function viewRect() {
      const b = canvasBox();
      const w = b.w / VIEW.s;
      const h = b.h / VIEW.s;
      return { x: VIEW.cx - w / 2, y: VIEW.cy - h / 2, w, h };
    }

    function applyView() {
      const v = viewRect();
      $("flow").setAttribute("viewBox", `${r2(v.x)} ${r2(v.y)} ${r2(v.w)} ${r2(v.h)}`);
      // Keep the grid locked to world coordinates — a grid that stayed put
      // while the diagram moved would read as a printed backdrop, not a
      // canvas. It is the layout's own unit, so node edges land on lines.
      const fine = r2(CELL * VIEW.s);
      const major = r2(MAJOR * VIEW.s);
      const ox = r2(-v.x * VIEW.s);
      const oy = r2(-v.y * VIEW.s);
      const canvas = $("canvas");
      canvas.style.backgroundSize = `${fine}px ${fine}px, ${fine}px ${fine}px, ${major}px ${major}px, ${major}px ${major}px`;
      canvas.style.backgroundPosition = `${ox}px ${oy}px, ${ox}px ${oy}px, ${ox}px ${oy}px, ${ox}px ${oy}px`;
      canvas.classList.toggle("coarse", CELL * VIEW.s < 9);
      $("zoom-pct").textContent = Math.round(VIEW.s * 100) + "%";
    }

    function clientToWorld(cx, cy) {
      const b = canvasBox();
      const v = viewRect();
      return { x: v.x + (cx - b.left) / VIEW.s, y: v.y + (cy - b.top) / VIEW.s };
    }

    function setView(v, animate) {
      if (viewAnim) cancelAnimationFrame(viewAnim);
      viewAnim = 0;
      const target = { cx: v.cx, cy: v.cy, s: clampScale(v.s) };
      if (!animate || REDUCE_MOTION) {
        VIEW.cx = target.cx; VIEW.cy = target.cy; VIEW.s = target.s;
        applyView();
        return;
      }
      const from = { cx: VIEW.cx, cy: VIEW.cy, s: VIEW.s };
      const t0 = performance.now();
      const dur = 280;
      const tick = (now) => {
        const k = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - k, 3);
        VIEW.cx = from.cx + (target.cx - from.cx) * e;
        VIEW.cy = from.cy + (target.cy - from.cy) * e;
        // Scale interpolates in log space: linear zoom reads as a lurch.
        VIEW.s = Math.exp(Math.log(from.s) + (Math.log(target.s) - Math.log(from.s)) * e);
        applyView();
        viewAnim = k < 1 ? requestAnimationFrame(tick) : 0;
      };
      viewAnim = requestAnimationFrame(tick);
    }

    function viewFor(box, maxScale, pad) {
      const b = canvasBox();
      const m = pad == null ? 28 : pad;
      const s = clampScale(Math.min(
        (b.w - m * 2) / Math.max(1, box.w),
        (b.h - m * 2) / Math.max(1, box.h),
        maxScale || 2
      ));
      return { cx: box.x + box.w / 2, cy: box.y + box.h / 2, s };
    }

    function fitAll(animate) {
      setView(viewFor({ x: 0, y: 0, w: WORLD.w, h: WORLD.h }, 2), animate);
      viewPinned = false;
    }

    function zoomAt(cx, cy, factor) {
      const before = clientToWorld(cx, cy);
      VIEW.s = clampScale(VIEW.s * factor);
      const after = clientToWorld(cx, cy);
      VIEW.cx += before.x - after.x;
      VIEW.cy += before.y - after.y;
      viewPinned = true;
      applyView();
    }

    function zoomBy(factor) {
      const b = canvasBox();
      zoomAt(b.left + b.w / 2, b.top + b.h / 2, factor);
    }

    function panBy(dx, dy) {
      VIEW.cx += dx / VIEW.s;
      VIEW.cy += dy / VIEW.s;
      viewPinned = true;
      applyView();
    }

    function boxOf(ids) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      (ids || []).forEach((id) => {
        const n = NODE_BOX[id];
        if (!n) return;
        x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y);
        x1 = Math.max(x1, n.x + n.w); y1 = Math.max(y1, n.y + n.h);
      });
      if (!Number.isFinite(x0)) return null;
      return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    }

    function boxVisible(box) {
      const v = viewRect();
      const m = 8;
      return box.x >= v.x + m && box.y >= v.y + m
        && box.x + box.w <= v.x + v.w - m && box.y + box.h <= v.y + v.h - m;
    }

    function inflate(box, k) {
      return { x: box.x - k, y: box.y - k, w: box.w + k * 2, h: box.h + k * 2 };
    }

    function liveIds() { return CURRENT.live || []; }

    function syncDetailUi() {
      const t = ui();
      const any = collapsibleGroups().length > 0;
      $("detail").hidden = !any;
      $("detail-sep").hidden = !any;
      $("detail-label").textContent = t.detail[detailMode || "auto"];
      $("detail").title = t.detailTitle;
    }

    function focusLive(animate) {
      const box = boxOf(liveIds());
      if (!box) { fitAll(animate); return; }
      setView(viewFor(inflate(box, 24), 1.6), animate);
      viewPinned = true;
    }

    // Below this, a 13px node label is roughly 8px on screen — the exact
    // "everything blurs together" state staged detail exists to avoid.
    const LEGIBLE = 0.62;

    function autoFrame(animate) {
      const whole = viewFor({ x: 0, y: 0, w: WORLD.w, h: WORLD.h }, 2);
      const box = boxOf(liveIds());
      // Fitting the whole graph is right until it stops being readable.
      // Past that point the step's own material wins the frame — the
      // overview is one click (or `0`) away, an illegible diagram is not.
      if (whole.s >= LEGIBLE || !box) setView(whole, animate);
      else setView(viewFor(inflate(box, 40), 1.4), animate);
      viewPinned = false;
    }

    // Opening a group is the reader looking at THAT group. Re-framing on the
    // current step there would drag them back to material they deliberately
    // navigated away from, so a disclosure toggle never re-frames: the view
    // stays put, and the only correction is keeping the node they just
    // toggled on screen — at the scale they chose, zooming out only if what
    // they opened no longer fits.
    function keepInView(id) {
      applyView();
      const box = NODE_BOX[id];
      if (!box || boxVisible(box)) return;
      setView(viewFor(inflate(box, 32), VIEW.s), true);
    }

    function syncViewport(live, keep) {
      if (keep) { keepInView(keep); return; }
      if (!viewReady) { viewReady = true; autoFrame(false); return; }
      if (!viewPinned) { autoFrame(true); return; }
      applyView();
      const box = boxOf(live);
      // Zoomed in and this step happens somewhere else on the canvas: pan
      // (and only if needed, zoom out) to it rather than narrate off-screen.
      if (box && !boxVisible(box)) setView(viewFor(inflate(box, 32), VIEW.s), true);
    }

    function renderFlow(highlight, step, keep) {
      const graph = visibleGraph(collapsedSet(highlight, step));
      const nodes = layoutNodes(graph.nodes, graph.edges);
      const pos = Object.fromEntries(nodes.map((n) => [n.id, n]));
      const edgesAll = graph.edges;
      const bands = rowBands(nodes);
      // A route is fine when it's short and local — e.g. two siblings in
      // one group — and keeping it there is what keeps it compact. It needs
      // the dedicated rail (see below) only when it would cut through some
      // OTHER node's body. Corridor routing keeps adjacent-rank edges clear
      // on its own, so what reaches the rail is what actually spans rows: a
      // long back-edge up a column, or a forward edge that skips ranks.
      const { plan, railX: railEnd } = routePlan(nodes, edgesAll, pos, bands);
      const { fromP, toP } = fanPorts(nodes, edgesAll, plan);
      alignPorts(nodes, edgesAll, pos, fromP, toP, plan);
      const { laneOf, countOf } = lanePlan(edgesAll, fromP, toP, pos, bands, plan);
      const hasBackRail = plan.some((r) => r && r.rail !== undefined);
      const maxX = Math.max(CELL * 26, ...nodes.map((n) => n.x + n.w + M.pad), hasBackRail ? railEnd + M.pad : 0);
      const maxY = Math.max(CELL * 15, ...nodes.map((n) => n.y + n.h + M.pad));
      const svg = $("flow");
      WORLD = { w: maxX, h: maxY };
      NODE_BOX = Object.fromEntries(nodes.map((n) => [n.id, { x: n.x, y: n.y, w: n.w, h: n.h }]));
      // A highlighted node that is currently folded away lights up the block
      // standing in for it, so no step ever points at nothing.
      const live = new Set((highlight || []).map((id) => graph.anchorOf[id] || id));
      CURRENT.live = [...live];
      const marks = `<defs>
        <style>
          .node-label, .node-label .txt {
            color: #f4f2ee !important;
            -webkit-text-fill-color: #f4f2ee !important;
            font-family: "Albert Sans", "Avenir Next", "Segoe UI", sans-serif;
          }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="oklch(82% 0 0 / 0.85)"></path>
        </marker>
        <marker id="arrow-live" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--primary)"></path>
        </marker>
        <marker id="arrow-rev" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 10 0 L 0 5 L 10 10 z" fill="oklch(82% 0 0 / 0.85)"></path>
        </marker>
        <marker id="arrow-live-rev" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 10 0 L 0 5 L 10 10 z" fill="var(--primary)"></path>
        </marker>
      </defs>`;
      const placed = [];
      const edgeEls = [];
      const labelEls = [];
      edgesAll.forEach((e, ei) => {
        const a = pos[e.from];
        const b = pos[e.to];
        if (!a || !b) return;
        const mid = e.via && pos[e.via];
        let d, lx, ly, vertical;
        if (mid) {
          const p = { x: a.x + a.w / 2, y: a.y + a.h };
          const q = { x: b.x + b.w / 2, y: b.y };
          const m = { x: mid.x + mid.w / 2, y: mid.y + mid.h / 2 };
          d = `M ${p.x} ${p.y} L ${m.x} ${m.y} L ${q.x} ${q.y}`;
          lx = m.x + 10; ly = m.y - 6; vertical = false;
        } else if (plan[ei] && plan[ei].rail !== undefined) {
          // Ports fanned like every other side: two edges out to the rail
          // from one box must not leave through the same point. A same-rank
          // sibling between the port and the rail sends the edge over its
          // own row instead — out of a top or bottom port, into a corridor
          // lane of its own.
          const p = fromP[ei] || pointOnSide(a, "right", 0, 1);
          const q = toP[ei] || pointOnSide(b, "right", 0, 1);
          const railX = plan[ei].rail;
          const sa = sideOf(a, p);
          const sb = sideOf(b, q);
          const cross = (port, side, id) => laneY(bands, port, { x: railX, y: port.y }, side,
            laneOf[id] || 0, countOf[id] || 1);
          const py = sa === "right" ? p.y : cross(p, sa, ei + ":from");
          const qy = sb === "right" ? q.y : cross(q, sb, ei + ":to");
          d = `M ${p.x} ${p.y}`;
          if (sa !== "right") d += ` L ${p.x} ${py}`;
          d += ` L ${railX} ${py} L ${railX} ${qy}`;
          if (sb !== "right") d += ` L ${q.x} ${qy}`;
          d += ` L ${q.x} ${q.y}`;
          lx = railX + 8; ly = (py + qy) / 2; vertical = true;
        } else {
          if (!fromP[ei] || !toP[ei]) return;
          ({ d, lx, ly, vertical } = orthoPath(a, b, fromP[ei], toP[ei], laneOf[ei] || 0, countOf[ei] || 1, bands, nodes));
        }
        const liveEdge = live.has(e.from) && live.has(e.to);
        const mk = edgeMarks(e, liveEdge);
        const token = tokenMark(d, liveEdge);
        edgeEls.push(`<path class="edge-halo" d="${d}"></path><path class="${mk.cls}"${mk.start}${mk.end} d="${d}"></path>${token}`);
        if (e.label) {
          const y = nudgeLabel(lx, ly, e.label, placed, vertical, nodes);
          labelEls.push(`<text class="edge-label${liveEdge ? " live" : ""}" x="${lx}" y="${y}" fill="#f4f2ee" text-anchor="${vertical ? "start" : "middle"}">${escapeHtml(e.label)}</text>`);
        }
      });
      // Only an EXPANDED fence splits into two passes (translucent shell
      // before the edges, caption after). A collapsed group is an ordinary
      // solid block and draws with the rest of them.
      const fences = nodes.filter((n) => isFence(n));
      const fenceShellEls = fences.map((n) => renderNode(n, live, "shell")).join("");
      const fenceLabelEls = fences.map((n) => renderNode(n, live, "content")).join("");
      const nodeEls = nodes.filter((n) => !isFence(n)).map((n) => renderNode(n, live)).join("");
      svg.innerHTML = marks + fenceShellEls + edgeEls.join("") + fenceLabelEls + nodeEls + labelEls.join("");
      svg.querySelectorAll(".node").forEach((el) => {
        el.addEventListener("click", (ev) => {
          if (ev.target.closest(".disclose")) return;
          if (justDragged) return;
          const id = el.getAttribute("data-id");
          // A folded block is a closed container first and a step link
          // second: clicking it means "open this", not "jump somewhere
          // else". Its step stays reachable from the rail, and from the
          // fence itself once it is open.
          if (el.classList.contains("collapsed")) { setCollapsed(id, false); return; }
          const stepIdx = stepForNode(id);
          if (stepIdx >= 0) show(stepIdx);
        });
      });
      svg.querySelectorAll(".disclose").forEach((el) => {
        const toggle = (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          setCollapsed(el.getAttribute("data-group"), el.getAttribute("aria-expanded") === "true");
        };
        el.addEventListener("click", toggle);
        el.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") toggle(ev);
        });
      });
      syncDetailUi();
      syncViewport([...live], keep);
    }

    function stepForNode(id) {
      const steps = LESSON.steps || [];
      const direct = steps.findIndex((s) => (s.highlight || []).includes(id));
      if (direct >= 0) return direct;
      const neigh = new Set();
      (LESSON.edges || []).forEach((e) => {
        if (e.from === id) neigh.add(e.to);
        if (e.to === id) neigh.add(e.from);
      });
      return steps.findIndex((s) => (s.highlight || []).some((h) => neigh.has(h)));
    }

    function show(index) {
      const steps = LESSON.steps || [];
      if (!steps.length) return;
      closePop();
      i = (index + steps.length) % steps.length;
      const step = steps[i];
      $("counter").textContent = `${i + 1} / ${steps.length}`;
      $("prev").disabled = i === 0 && !timer;
      $("next").disabled = i === steps.length - 1 && !timer;
      renderRich($("narration"), step.narration || "");
      const file = (step.code && step.code.file) || "";
      const start = step.code && step.code.startLine ? `:${step.code.startLine}` : "";
      $("code-file").textContent = file + start;
      renderCode((step.code && step.code.text) || "", step.code && step.code.startLine);
      [...document.querySelectorAll(".step")].forEach((btn, idx) => {
        if (idx === i) btn.setAttribute("aria-current", "true");
        else btn.removeAttribute("aria-current");
      });
      CURRENT = { highlight: step.highlight || [], step, live: CURRENT.live };
      renderFlow(step.highlight || [], step);
    }

    function play() {
      if (timer) {
        clearInterval(timer);
        timer = null;
        setPlay(false);
        show(i);
        return;
      }
      setPlay(true);
      $("prev").disabled = false;
      $("next").disabled = false;
      timer = setInterval(() => show(i + 1), 2400);
    }

    function boot() {
      if (!LESSON || typeof LESSON !== "object") {
        document.body.innerHTML = "<p>LESSON JSON was not injected (__LESSON_JSON__).</p>";
        return;
      }
      const t = ui();
      document.documentElement.lang = String(LESSON.lang || "en").slice(0, 2);
      $("lbl-back").textContent = t.back;
      $("lbl-next").textContent = t.next;
      $("stage-copy").textContent = t.stage;
      $("lbl-problem").textContent = t.problem;
      $("lbl-why").textContent = t.why;
      $("lbl-cost").textContent = t.cost;
      $("steps").setAttribute("aria-label", t.steps);
      applyAccent(LESSON.kind && !LESSON.accent ? KIND_ACCENT[LESSON.kind] : LESSON.accent);
      // An unlisted kind still gets named — the shell says what the JSON
      // said rather than pretending the lesson has no type.
      $("kind").textContent = LESSON.kind ? (t.kinds[LESSON.kind] || LESSON.kind) : "";
      $("dzen").onclick = () => setDzen(!dzen);
      $("panel").onclick = () => setPanel(!panelOpen, true);
      syncChrome();
      setPlay(false);
      renderRich($("pattern"), LESSON.pattern || "Lesson");
      renderRich($("title"), LESSON.title || "Lesson");
      document.title = (LESSON.title || "You Don't Know").replace(/`/g, "");
      renderRich($("thesis"), LESSON.thesis || "");
      renderRich($("problem"), LESSON.problem || "");
      renderRich($("whyNotBasic"), LESSON.whyNotBasic || "");
      renderRich($("cost"), LESSON.cost || "");
      const repeats = LESSON.repeats || [];
      if (repeats.length) {
        $("repeats").classList.add("on");
        renderRich($("repeats"), "Также здесь: " + repeats.map((r) => `${r.module} (${r.file}) — ${r.note}`).join(" · "));
      }
      $("steps").innerHTML = (LESSON.steps || []).map((s, idx) =>
        `<button class="step" type="button" data-i="${idx}"><span class="n">${pad(idx)}</span><span class="t"></span></button>`
      ).join("");
      [...$("steps").querySelectorAll(".step")].forEach((btn, idx) => {
        renderRich(btn.querySelector(".t"), (LESSON.steps[idx] && LESSON.steps[idx].title) || "");
      });
      $("steps").addEventListener("click", (ev) => {
        const btn = ev.target.closest("[data-i]");
        if (btn) show(Number(btn.dataset.i));
      });
      $("play").onclick = play;
      $("prev").onclick = () => show(i - 1);
      $("next").onclick = () => show(i + 1);
      document.addEventListener("click", (ev) => {
        const pop = $("pop");
        if (pop.hidden) return;
        if (pop.contains(ev.target) || ev.target.closest(".fn")) return;
        closePop();
      });
      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") {
          if (!$("pop").hidden) { ev.preventDefault(); closePop(); }
          return;
        }
        // Figma-side of the keyboard. `+ / - / 0 / 1 / 2` work bare and with
        // Ctrl/⌘, so the muscle memory from either app lands somewhere sane.
        if (ev.key === "+" || ev.key === "=") { ev.preventDefault(); zoomBy(1.25); return; }
        if (ev.key === "-" || ev.key === "_") { ev.preventDefault(); zoomBy(0.8); return; }
        if (ev.key === "0") { ev.preventDefault(); fitAll(true); return; }
        if (ev.key === "1") {
          ev.preventDefault();
          setView({ cx: VIEW.cx, cy: VIEW.cy, s: 1 }, true);
          viewPinned = true;
          return;
        }
        if (ev.key === "2") { ev.preventDefault(); focusLive(true); return; }
        if (ev.key === " ") { ev.preventDefault(); play(); }
        if (ev.key === "ArrowRight") show(i + 1);
        if (ev.key === "ArrowLeft") show(i - 1);
      });
      window.addEventListener("resize", () => { closePop(); applyView(); });

      // --- canvas: pan · zoom · detail ---
      const canvas = $("canvas");
      $("hint").innerHTML = t.hint;
      $("zoom-in").title = t.zoomIn;
      $("zoom-out").title = t.zoomOut;
      $("zoom-pct").title = t.zoomReset;
      $("zoom-fit").title = t.fit;
      $("zoom-step").title = t.focus;
      $("zoom-in").onclick = () => zoomBy(1.25);
      $("zoom-out").onclick = () => zoomBy(0.8);
      $("zoom-pct").onclick = () => { setView({ cx: VIEW.cx, cy: VIEW.cy, s: 1 }, true); viewPinned = true; };
      $("zoom-fit").onclick = () => fitAll(true);
      $("zoom-step").onclick = () => focusLive(true);
      $("detail").onclick = () => {
        detailMode = detailMode === null ? "full" : (detailMode === "full" ? "step" : null);
        collapseOverride.clear(); // the switch speaks for the whole canvas again
        renderFlow(CURRENT.highlight, CURRENT.step);
      };

      canvas.addEventListener("wheel", (ev) => {
        ev.preventDefault();
        const unit = ev.deltaMode === 1 ? 16 : 1;
        // Trackpad pinch arrives as a ctrlKey wheel — same branch as ⌘/Ctrl.
        if (ev.ctrlKey || ev.metaKey) {
          zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * unit * 0.0022));
          return;
        }
        if (ev.shiftKey) panBy((ev.deltaY || ev.deltaX) * unit, 0);
        else panBy(ev.deltaX * unit, ev.deltaY * unit);
      }, { passive: false });

      const pointers = new Map();
      let drag = null;
      let pinch = null;
      const pinchState = () => {
        const [a, b] = [...pointers.values()];
        return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      };
      canvas.addEventListener("pointerdown", (ev) => {
        justDragged = false;
        if (ev.pointerType === "mouse" && ev.button !== 0 && ev.button !== 1) return;
        pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
        if (pointers.size === 2) { drag = null; pinch = pinchState(); return; }
        if (pointers.size > 2) return;
        // No pointer capture yet: capturing here would retarget the click and
        // kill every node tap. It is claimed only once this becomes a drag.
        drag = { id: ev.pointerId, x: ev.clientX, y: ev.clientY, moved: false };
      });
      canvas.addEventListener("pointermove", (ev) => {
        if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
        if (pinch && pointers.size >= 2) {
          const now = pinchState();
          if (pinch.d > 0) zoomAt(now.x, now.y, now.d / pinch.d);
          panBy(-(now.x - pinch.x), -(now.y - pinch.y));
          pinch = now;
          return;
        }
        if (!drag || ev.pointerId !== drag.id) return;
        const dx = ev.clientX - drag.x;
        const dy = ev.clientY - drag.y;
        if (!drag.moved) {
          if (Math.abs(dx) + Math.abs(dy) < 4) return;
          drag.moved = true;
          justDragged = true;
          canvas.classList.add("panning");
          try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* pointer already gone */ }
        }
        drag.x = ev.clientX;
        drag.y = ev.clientY;
        panBy(-dx, -dy);
      });
      const endPointer = (ev) => {
        pointers.delete(ev.pointerId);
        if (pointers.size < 2) pinch = null;
        if (!drag || drag.id !== ev.pointerId) return;
        if (drag.moved) {
          canvas.classList.remove("panning");
          try { canvas.releasePointerCapture(ev.pointerId); } catch (e) { /* not captured */ }
        }
        drag = null;
      };
      canvas.addEventListener("pointerup", endPointer);
      canvas.addEventListener("pointercancel", endPointer);
      // A drag that ends over a node must not also open that node's step.
      canvas.addEventListener("click", (ev) => {
        if (!justDragged) return;
        ev.stopPropagation();
        ev.preventDefault();
        justDragged = false;
      }, true);
      canvas.addEventListener("dblclick", (ev) => {
        if (ev.target.closest(".node")) return;
        fitAll(true);
      });
      if (window.ResizeObserver) {
        // Re-frame, don't blind-fit: on a narrow canvas fitting the whole
        // graph is exactly what makes it unreadable.
        new ResizeObserver(() => { if (viewPinned) applyView(); else autoFrame(false); }).observe(canvas);
      }

      show(0);
    }

    boot();
  </script>
</body>
</html>
