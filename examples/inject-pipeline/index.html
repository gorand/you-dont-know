<!DOCTYPE html>
<html lang="en" data-accent="iris">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0b09" />
  <title>You Don't Know</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    /*
      Design lock — lacquer surfaces. Accent is --primary (see [data-accent]).
      Default iris (how it works).
      Color lock: --primary hue 200–320 only (iris 304, glacier 232, dusk 275).
      FORBIDDEN as --primary: 0–50 error, 70–110 warning, 125–165 success.
      --node-fill is achromatic. Highlight mix uses srgb (oklch mix crosses traffic-light hues).
      --state-* never follow data-accent. Do not restyle per lesson.
    */
    :root {
      --lacquer: oklch(7% 0.006 95);
      --lacquer-deep: oklch(4% 0.004 95);
      --raised: oklch(11% 0.006 95);
      --graphite: oklch(15% 0.008 95);
      --node-fill: oklch(32% 0 0);
      --node-ink: #f4f2ee;
      --champagne: oklch(96% 0.005 95);
      --text: oklch(94% 0.004 95);
      --muted: oklch(82% 0 0);
      --faint: oklch(76% 0 0);
      --hairline: oklch(78% 0 0 / 0.16);
      --state-error: oklch(68% 0.18 28);
      --state-warn: oklch(78% 0.14 85);
      --state-ok: oklch(72% 0.14 145);
      --warn: var(--state-error);
      --syn-str: oklch(78% 0.08 155);
      --syn-num: oklch(78% 0.07 250);
      --syn-type: oklch(86% 0.04 230);
      --font-ui: "Albert Sans", "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", "Roboto Mono", ui-monospace, Consolas, monospace;
      --ease: cubic-bezier(0, 0, 0.2, 1);
      --r: 2px;
      --primary: oklch(74% 0.12 304);
      --primary-pale: oklch(84% 0.07 304);
      --primary-deep: oklch(52% 0.1 304);
      --primary-rule: oklch(74% 0.1 304 / 0.55);
      --on-primary: oklch(16% 0.04 304);
      --primary-soft: oklch(74% 0.12 304 / 0.16);
    }
    html[data-accent="iris"] {
      --primary: oklch(74% 0.12 304);
      --primary-pale: oklch(84% 0.07 304);
      --primary-deep: oklch(52% 0.1 304);
      --primary-rule: oklch(74% 0.1 304 / 0.55);
      --on-primary: oklch(16% 0.04 304);
      --primary-soft: oklch(74% 0.12 304 / 0.16);
    }
    html[data-accent="glacier"] {
      --primary: oklch(76% 0.09 232);
      --primary-pale: oklch(86% 0.05 232);
      --primary-deep: oklch(50% 0.08 232);
      --primary-rule: oklch(76% 0.08 232 / 0.55);
      --on-primary: oklch(16% 0.03 232);
      --primary-soft: oklch(76% 0.09 232 / 0.16);
    }
    html[data-accent="dusk"] {
      --primary: oklch(72% 0.11 275);
      --primary-pale: oklch(84% 0.07 275);
      --primary-deep: oklch(50% 0.1 275);
      --primary-rule: oklch(72% 0.09 275 / 0.55);
      --on-primary: oklch(16% 0.04 275);
      --primary-soft: oklch(72% 0.11 275 / 0.16);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; height: 100%; }
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      background: var(--lacquer);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 1rem;
      line-height: 1.5;
    }
    ::selection { background: var(--primary-soft); color: var(--champagne); }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .ico {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ico.fill, .ico .fill { fill: currentColor; stroke: none; }
    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
      padding: 14px 24px 12px;
      border-bottom: 1px solid var(--hairline);
      min-width: 0;
      background: var(--lacquer);
    }
    .kicker {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--primary-pale);
      margin: 0 0 6px;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.3;
      color: var(--champagne);
      overflow-wrap: anywhere;
      text-wrap: balance;
    }
    .thesis {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 72ch;
      overflow-wrap: anywhere;
      line-height: 1.55;
    }
    .transport {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      padding-top: 2px;
    }
    /* View switches (focus mode, inspector) sit left of the transport and
       share its hairline divider — same lacquer control, no card. */
    .views {
      display: flex;
      gap: 6px;
      margin-right: 8px;
      padding-right: 12px;
      border-right: 1px solid var(--hairline);
    }
    button.ctrl.icon { padding: 7px 8px; }
    button.ctrl.ghost[aria-pressed="true"] {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-pale);
    }
    /* What kind of lesson this is, stated once and quietly, in the accent
       the kind itself selected. Not a picker: the reader has no accent to
       choose, so this reads the shell's decision back rather than offering
       one. */
    .kind {
      display: inline-flex;
      align-items: baseline;
      color: var(--primary);
    }
    .kind:empty { display: none; }
    .kind::before {
      content: "";
      align-self: center;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--primary);
    }
    .kind::after {
      content: "·";
      margin: 0 6px;
      color: var(--faint);
    }
    .counter {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
      color: var(--muted);
      min-width: 4.5rem;
      text-align: right;
    }
    button.ctrl {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: var(--r);
      padding: 8px 14px;
      cursor: pointer;
      touch-action: manipulation;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: background-color 120ms var(--ease), transform 90ms var(--ease), opacity 120ms var(--ease);
    }
    button.ctrl:active { transform: scale(0.98); }
    button.ctrl:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }
    button.ctrl.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    button.ctrl.primary:hover:not(:disabled) { background: var(--primary-pale); }
    button.ctrl.ghost { background: transparent; color: var(--primary); border-color: var(--primary-rule); }
    button.ctrl.ghost:hover:not(:disabled) { background: var(--primary-soft); }
    .main {
      --rail-w: 14.5rem;
      display: grid;
      grid-template-columns: var(--rail-w) minmax(0, 1fr) minmax(18rem, 26rem);
      min-height: 0;
      min-width: 0;
    }
    .rail, .stage, .inspector {
      min-width: 0;
      min-height: 0;
    }
    .rail {
      overflow: auto;
      border-right: 1px solid var(--hairline);
      padding: 10px 8px 16px 10px;
      background: var(--lacquer);
    }
    .stage {
      overflow: hidden;
      padding: 12px 16px 16px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--lacquer);
    }
    /* The viewport. World coordinates live in the SVG viewBox; the grid
       under it is painted by CSS and re-synced to the same transform on
       every pan/zoom, so the canvas reads as one surface that moves. */
    .canvas {
      position: relative;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--hairline);
      border-radius: var(--r);
      /* Two densities on one unit: a faint line every CELL, a readable one
         every MAJOR (4 cells). Sizes and offsets are re-synced from the
         viewport transform on every pan/zoom — see applyView. The fine
         layer drops out below ~0.5 scale, where it would only be mud. */
      --grid-fine: oklch(78% 0 0 / 0.09);
      --grid-major: oklch(78% 0 0 / 0.2);
      background-color: var(--lacquer-deep);
      background-image:
        linear-gradient(var(--grid-fine) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-fine) 1px, transparent 1px),
        linear-gradient(var(--grid-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-major) 1px, transparent 1px);
      touch-action: none;
      cursor: grab;
    }
    .canvas.coarse { --grid-fine: transparent; }
    .canvas.panning { cursor: grabbing; }
    .stage-label {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 0 0 8px;
    }
    svg.flow {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      color: #f4f2ee;
    }
    .hint {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.06em;
      text-transform: none;
      color: var(--faint);
    }
    .hint kbd {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      color: var(--muted);
      border: 1px solid var(--hairline);
      border-radius: 3px;
      padding: 0 4px;
      line-height: 1.5;
    }
    .zoombar {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--hairline);
      border-radius: var(--r);
      background: color-mix(in srgb, var(--graphite) 90%, transparent);
      box-shadow: 0 8px 24px oklch(4% 0.004 95 / 0.5);
    }
    .zoombar button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 26px;
      height: 24px;
      padding: 0 6px;
      font: inherit;
      font-size: 0.75rem;
      color: var(--primary);
      background: transparent;
      border: 0;
      border-radius: var(--r);
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 120ms var(--ease), transform 90ms var(--ease);
    }
    .zoombar button:hover { background: var(--primary-soft); }
    .zoombar button:active { transform: scale(0.92); }
    .zoombar .ico { width: 13px; height: 13px; }
    .zoombar .zsep { width: 1px; height: 16px; margin: 0 3px; background: var(--hairline); }
    .zoombar .pct {
      min-width: 3.25rem;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .zoombar .detail {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .zoombar .detail .ico { color: var(--primary); }
    .zoombar [hidden] { display: none; }
    .node { cursor: pointer; touch-action: manipulation; }
    .node .node-shell {
      fill: var(--node-fill);
      stroke: oklch(78% 0 0 / 0.35);
      stroke-width: 1;
      transform-box: fill-box;
      transform-origin: center;
      transition: fill 160ms var(--ease), stroke 160ms var(--ease), transform 90ms var(--ease);
    }
    .node:active .node-shell { transform: scale(0.96); }
    .node.on .node-shell {
      fill: color-mix(in srgb, var(--primary) 34%, var(--node-fill));
      stroke: var(--primary);
      stroke-width: 1.6;
    }
    .node.kind-boundary .node-shell { stroke: var(--state-error); }
    .node.on.kind-boundary .node-shell {
      fill: color-mix(in srgb, var(--state-error) 30%, var(--node-fill));
      stroke: var(--state-error);
    }
    .node.kind-frame .node-shell { stroke-dasharray: 4 3; stroke: var(--primary-deep); }
    .node.kind-action .node-shell { stroke: var(--primary); }
    .node.kind-group .node-shell {
      fill: oklch(16% 0 0 / 0.5);
      stroke: oklch(78% 0 0 / 0.28);
      stroke-dasharray: 5 4;
    }
    .node.on.kind-group .node-shell {
      fill: color-mix(in srgb, var(--primary) 14%, oklch(16% 0 0 / 0.5));
      stroke: var(--primary);
      stroke-dasharray: 5 4;
    }
    /* A collapsed group is a solid block, not a fence: it stands in for its
       children, so it must read as one object. The offset ghost rect behind
       it is the only hint that something is folded inside. */
    .node.kind-group.collapsed .node-shell {
      fill: var(--node-fill);
      stroke: oklch(78% 0 0 / 0.42);
      stroke-dasharray: none;
    }
    .node.on.kind-group.collapsed .node-shell {
      fill: color-mix(in srgb, var(--primary) 34%, var(--node-fill));
      stroke: var(--primary);
    }
    .node-stack {
      fill: var(--node-fill);
      stroke: oklch(78% 0 0 / 0.26);
      stroke-width: 1;
      pointer-events: none;
    }
    .node.on .node-stack { stroke: var(--primary-rule); }
    .disclose { cursor: pointer; touch-action: manipulation; }
    .disclose-bg {
      fill: oklch(18% 0 0 / 0.92);
      stroke: var(--primary-rule);
      stroke-width: 1;
      transition: fill 120ms var(--ease), stroke 120ms var(--ease);
    }
    .disclose:hover .disclose-bg { fill: color-mix(in srgb, var(--primary) 26%, oklch(18% 0 0)); stroke: var(--primary); }
    .disclose-mark {
      fill: none;
      stroke: var(--primary-pale);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .disclose-n {
      fill: var(--primary-pale);
      font: 500 10px var(--font-mono);
      pointer-events: none;
      dominant-baseline: middle;
    }
    .node-ico {
      overflow: visible;
      pointer-events: none;
      stroke: var(--node-ink);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.78;
    }
    .node.on .node-ico { stroke: var(--primary); opacity: 1; }
    .node.kind-boundary .node-ico { stroke: var(--state-error); opacity: 1; }
    .node.on.kind-boundary .node-ico { stroke: var(--state-error); }
    .node-label {
      font: 500 13px/1.3 var(--font-ui);
      color: var(--node-ink);
      -webkit-text-fill-color: var(--node-ink);
      padding: 8px 8px 8px 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      height: 100%;
      pointer-events: none;
    }
    .node-label .txt {
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .edge {
      fill: none;
      stroke: oklch(72% 0 0 / 0.45);
      stroke-width: 1.4;
      stroke-linejoin: round;
      stroke-linecap: butt;
      pointer-events: none;
    }
    .edge-halo {
      fill: none;
      stroke: var(--lacquer-deep);
      stroke-width: 7;
      stroke-linejoin: round;
      stroke-linecap: butt;
      pointer-events: none;
    }
    .edge.live { stroke: var(--primary); stroke-width: 1.8; }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label {
      fill: #f4f2ee;
      font: 500 11px/1 var(--font-ui);
      pointer-events: none;
      paint-order: stroke fill;
      stroke: var(--lacquer-deep);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .edge-label.live { fill: var(--primary-pale); }
    .token { fill: var(--primary); }
    .inspector {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-left: 1px solid var(--hairline);
      background: var(--raised);
      overflow: hidden;
    }
    .narration-wrap {
      padding: 14px 16px;
      border-bottom: 1px solid var(--hairline);
      overflow: auto;
      min-width: 0;
    }
    .narration {
      overflow-wrap: anywhere;
      color: var(--text);
      line-height: 1.65;
    }
    .fn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.15rem;
      height: 1.15rem;
      margin: 0 0.08em 0 0.22em;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      cursor: pointer;
      vertical-align: -0.18em;
      touch-action: manipulation;
      transition: background-color 120ms var(--ease), color 120ms var(--ease), transform 90ms var(--ease);
    }
    .fn:active { transform: scale(0.88); }
    .fn .ico {
      width: 14px;
      height: 14px;
      display: block;
    }
    .fn[aria-expanded="true"] {
      background: var(--primary);
      color: var(--on-primary);
    }
    .pop code {
      font-size: 0.84em;
    }
    .aside-title {
      display: block;
      margin: 0 0 6px;
      color: var(--primary-pale);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .pop {
      position: fixed;
      z-index: 40;
      width: min(26rem, calc(100vw - 24px));
      max-height: min(42vh, 22rem);
      overflow: auto;
      padding: 12px 14px 14px;
      background: var(--graphite);
      color: var(--text);
      border: 1px solid var(--primary-rule);
      border-radius: var(--r);
      box-shadow: 0 16px 40px oklch(4% 0.004 95 / 0.62);
      font-size: 0.875rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
      user-select: text;
    }
    .pop[hidden] { display: none; }
    .code {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;
      background: var(--lacquer-deep);
    }
    .code-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--graphite);
      border-bottom: 1px solid var(--hairline);
      color: var(--primary-pale);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.04em;
      min-width: 0;
    }
    .code-head .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .code-body {
      margin: 0;
      padding: 8px 0 14px;
      overflow: auto;
      min-height: 0;
      background: oklch(3.5% 0.004 95);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.6;
    }
    .code-body::-webkit-scrollbar { width: 8px; height: 8px; }
    .code-body::-webkit-scrollbar-thumb { background: color-mix(in oklch, var(--primary) 40%, transparent); border-radius: 2px; }
    .rail::-webkit-scrollbar, .stage::-webkit-scrollbar { width: 8px; height: 8px; }
    .rail::-webkit-scrollbar-thumb, .stage::-webkit-scrollbar-thumb { background: oklch(78% 0 0 / 0.22); border-radius: 2px; }
    .line {
      display: grid;
      grid-template-columns: 3rem minmax(0, 1fr);
      min-width: 0;
    }
    .line:hover { background: var(--primary-soft); }
    .ln {
      color: var(--faint);
      text-align: right;
      padding: 0 12px 0 8px;
      user-select: none;
      font-variant-numeric: tabular-nums;
      border-right: 1px solid var(--hairline);
      margin-right: 12px;
    }
    .lt {
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding-right: 14px;
    }
    .tok-kw { color: var(--primary-pale); }
    .tok-str { color: var(--syn-str); }
    .tok-cmt { color: var(--faint); font-style: italic; }
    .tok-num { color: var(--syn-num); }
    .tok-type { color: var(--syn-type); }
    .step {
      display: grid;
      grid-template-columns: 1.7rem minmax(0, 1fr);
      gap: 8px;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 8px 8px 8px 6px;
      cursor: pointer;
      border-radius: var(--r);
      align-items: center;
      touch-action: manipulation;
      transition: background-color 120ms var(--ease), transform 90ms var(--ease);
    }
    .step:hover { background: color-mix(in srgb, var(--primary) 18%, transparent); }
    .step:active { transform: scale(0.98); }
    .step[aria-current="true"] { background: color-mix(in srgb, var(--primary) 22%, transparent); }
    .step[aria-current="true"]:hover { background: color-mix(in srgb, var(--primary) 38%, transparent); }
    .step .n {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
      line-height: 1.35;
    }
    .step .t { overflow-wrap: anywhere; font-size: 0.875rem; line-height: 1.35; color: var(--text); }
    .repeats {
      display: none;
      padding: 8px 24px;
      font-size: 0.8125rem;
      color: var(--muted);
      border-top: 1px solid var(--hairline);
    }
    .repeats.on { display: block; }
    .notes {
      display: grid;

      height: 16px;

      margin: 0;
      font-size: 0.875rem;
      line-height: 1.55;

      font-size: 0.84em;
      background: var(--primary-soft);
      color: var(--primary-pale);
      padding: 0.05em 0.28em;
      border-radius: 3px;
    }
    .lt code { background: none; color: inherit; padding: 0; }
    /* --- chrome modes ---------------------------------------------------
       Two independent switches, both session-only: nothing here is written
       anywhere, so a reload comes back to the full layout.

       `no-inspector` drops the code panel and gives the canvas its width.
       `dzen` additionally drops everything that DESCRIBES the lesson —
       kicker (with it the kind), thesis, the notes footer — and keeps all
       of what
       DRIVES it: the title, the transport, the steps rail. The rail only
       gets denser, because losing the step titles would cost more than the
       ~40px of canvas it buys back. */
    body.no-inspector .inspector { display: none; }
    body.no-inspector .main { grid-template-columns: var(--rail-w) minmax(0, 1fr); }
    body.dzen .kicker,
    body.dzen .thesis,
    body.dzen .notes,
    body.dzen .repeats { display: none; }
    body.dzen .top { padding: 10px 24px 10px; align-items: center; }
    body.dzen .main { --rail-w: 12.25rem; }
    body.dzen .rail { padding: 8px 6px 12px 6px; }
    body.dzen .step {
      grid-template-columns: 1.4rem minmax(0, 1fr);
      gap: 6px;
      padding: 6px 6px 6px 4px;
    }
    body.dzen .stage { padding: 10px 12px 12px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    @media (max-width: 1100px) {
      body {
        height: auto;
        min-height: 100dvh;
        overflow: auto;
        grid-template-rows: auto;
        /* Rows here are all auto, so leftover height would be shared out
           among them — and with the notes and the inspector gone in Dzen
           there IS leftover height, which inflated the header instead of
           doing anything useful. Park it at the bottom; the canvas takes
           its share through its own min-height below. */
        align-content: start;
        padding-bottom: 24px;
      }
      .top { grid-template-columns: minmax(0, 1fr); }
      .transport { flex-wrap: wrap; justify-content: flex-start; }
      .main {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        grid-template-areas:
          "stage inspector"
          "rail rail";
        overflow: visible;
      }
      .stage { grid-area: stage; min-height: 20rem; }
      .inspector {
        grid-area: inspector;
        min-height: 20rem;
        border-left: 1px solid var(--hairline);
      }
      .rail {
        grid-area: rail;
        display: flex;
        flex-direction: row;
        gap: 4px;
        overflow-x: auto;
        border-right: 0;
        border-top: 1px solid var(--hairline);
        padding: 8px 12px 12px;
      }
      .step { flex: 0 0 12rem; }
      body.no-inspector .main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "stage"
          "rail";
      }
      body.dzen .step { flex: 0 0 10.5rem; }
      body.dzen .canvas { min-height: 62vh; }
      .canvas { min-height: 18rem; }
      .hint { display: none; }
      /* The page itself scrolls at this width. A canvas that swallowed
         vertical drags would trap the reader inside an 18rem box, so the
         browser keeps vertical panning and only sideways drags move the
         diagram — the zoombar covers the rest. */
      .canvas { touch-action: pan-y; }
      .notes { max-height: none; }
    }
    @media (max-width: 720px) {
      .main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "stage"
          "inspector"
          "rail";
      }
      .inspector { border-left: 0; border-top: 1px solid var(--hairline); }
      .notes { grid-template-columns: minmax(0, 1fr); }
      body.no-inspector .main {
        grid-template-areas:
          "stage"
          "rail";
      }
    }
