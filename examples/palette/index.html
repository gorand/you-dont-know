<!DOCTYPE html>
<html lang="en" data-accent="iris">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You Don't Know</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    /*
      Design lock — lacquer surfaces. Accent is --primary (see [data-accent]).
      Default iris (how it works).
      Color lock: --primary hue 200–320 only (iris 304, glacier 232, dusk 275).
      FORBIDDEN as --primary: 0–50 error, 70–110 warning, 125–165 success.
      --node-fill is achromatic. Highlight mix uses srgb (oklch mix crosses traffic-light hues).
      --state-* never follow data-accent. Do not restyle per lesson.
    */
    :root {
      --lacquer: oklch(7% 0.006 95);
      --lacquer-deep: oklch(4% 0.004 95);
      --raised: oklch(11% 0.006 95);
      --graphite: oklch(15% 0.008 95);
      --node-fill: oklch(32% 0 0);
      --node-ink: #f4f2ee;
      --champagne: oklch(96% 0.005 95);
      --text: oklch(94% 0.004 95);
      --muted: oklch(82% 0 0);
      --faint: oklch(76% 0 0);
      --hairline: oklch(78% 0 0 / 0.16);
      --state-error: oklch(68% 0.18 28);
      --state-warn: oklch(78% 0.14 85);
      --state-ok: oklch(72% 0.14 145);
      --warn: var(--state-error);
      --syn-str: oklch(78% 0.08 155);
      --syn-num: oklch(78% 0.07 250);
      --syn-type: oklch(86% 0.04 230);
      --font-ui: "Albert Sans", "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", "Roboto Mono", ui-monospace, Consolas, monospace;
      --ease: cubic-bezier(0, 0, 0.2, 1);
      --r: 2px;
      --primary: oklch(74% 0.12 304);
      --primary-pale: oklch(84% 0.07 304);
      --primary-deep: oklch(52% 0.1 304);
      --primary-rule: oklch(74% 0.1 304 / 0.55);
      --on-primary: oklch(16% 0.04 304);
      --primary-soft: oklch(74% 0.12 304 / 0.16);
    }
    html[data-accent="iris"] {
      --primary: oklch(74% 0.12 304);
      --primary-pale: oklch(84% 0.07 304);
      --primary-deep: oklch(52% 0.1 304);
      --primary-rule: oklch(74% 0.1 304 / 0.55);
      --on-primary: oklch(16% 0.04 304);
      --primary-soft: oklch(74% 0.12 304 / 0.16);
    }
    html[data-accent="glacier"] {
      --primary: oklch(76% 0.09 232);
      --primary-pale: oklch(86% 0.05 232);
      --primary-deep: oklch(50% 0.08 232);
      --primary-rule: oklch(76% 0.08 232 / 0.55);
      --on-primary: oklch(16% 0.03 232);
      --primary-soft: oklch(76% 0.09 232 / 0.16);
    }
    html[data-accent="dusk"] {
      --primary: oklch(72% 0.11 275);
      --primary-pale: oklch(84% 0.07 275);
      --primary-deep: oklch(50% 0.1 275);
      --primary-rule: oklch(72% 0.09 275 / 0.55);
      --on-primary: oklch(16% 0.04 275);
      --primary-soft: oklch(72% 0.11 275 / 0.16);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; height: 100%; }
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      background: var(--lacquer);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 1rem;
      line-height: 1.5;
    }
    ::selection { background: var(--primary-soft); color: var(--champagne); }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .ico {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ico.fill, .ico .fill { fill: currentColor; stroke: none; }
    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
      padding: 14px 24px 12px;
      border-bottom: 1px solid var(--hairline);
      min-width: 0;
      background: var(--lacquer);
    }
    .kicker {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--primary-pale);
      margin: 0 0 6px;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 500;
      line-height: 1.3;
      color: var(--champagne);
      overflow-wrap: anywhere;
    }
    .thesis {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 72ch;
      overflow-wrap: anywhere;
      line-height: 1.55;
    }
    .transport {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      padding-top: 2px;
    }
    .accents {
      display: flex;
      gap: 6px;
      margin-right: 8px;
      padding-right: 12px;
      border-right: 1px solid var(--hairline);
    }
    .accents button {
      width: 14px;
      height: 14px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--hairline);
      cursor: pointer;
      background: var(--swatch);
    }
    .accents button[aria-pressed="true"] {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .counter {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.08em;
      color: var(--muted);
      min-width: 4.5rem;
      text-align: right;
    }
    button.ctrl {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: var(--r);
      padding: 8px 14px;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: background-color 120ms var(--ease), transform 90ms var(--ease), opacity 120ms var(--ease);
    }
    button.ctrl:active { transform: scale(0.98); }
    button.ctrl:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }
    button.ctrl.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    button.ctrl.primary:hover:not(:disabled) { background: var(--primary-pale); }
    button.ctrl.ghost { background: transparent; color: var(--primary); border-color: var(--primary-rule); }
    button.ctrl.ghost:hover:not(:disabled) { background: var(--primary-soft); }
    .main {
      display: grid;
      grid-template-columns: 14.5rem minmax(0, 1fr) minmax(18rem, 26rem);
      min-height: 0;
      min-width: 0;
    }
    .rail, .stage, .inspector {
      min-width: 0;
      min-height: 0;
    }
    .rail {
      overflow: auto;
      border-right: 1px solid var(--hairline);
      padding: 10px 8px 16px 10px;
      background: var(--lacquer);
    }
    .stage {
      overflow: auto;
      padding: 12px 16px 16px;
      background:
        linear-gradient(var(--hairline) 1px, transparent 1px) 0 0 / 24px 24px,
        linear-gradient(90deg, var(--hairline) 1px, transparent 1px) 0 0 / 24px 24px,
        var(--lacquer-deep);
    }
    .stage-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 0 0 8px;
    }
    svg.flow {
      display: block;
      width: 100%;
      height: calc(100% - 1.5rem);
      min-height: 12rem;
      margin-inline: auto;
      color: #f4f2ee;
    }
    .node { cursor: pointer; }
    .node .node-shell {
      fill: var(--node-fill);
      stroke: oklch(78% 0 0 / 0.35);
      stroke-width: 1;
      transition: fill 160ms var(--ease), stroke 160ms var(--ease);
    }
    .node.on .node-shell {
      fill: color-mix(in srgb, var(--primary) 34%, var(--node-fill));
      stroke: var(--primary);
      stroke-width: 1.6;
    }
    .node.kind-boundary .node-shell { stroke: var(--state-error); }
    .node.on.kind-boundary .node-shell {
      fill: color-mix(in srgb, var(--state-error) 30%, var(--node-fill));
      stroke: var(--state-error);
    }
    .node.kind-frame .node-shell { stroke-dasharray: 4 3; stroke: var(--primary-deep); }
    .node.kind-action .node-shell { stroke: var(--primary); }
    .node.kind-group .node-shell {
      fill: oklch(16% 0 0 / 0.5);
      stroke: oklch(78% 0 0 / 0.28);
      stroke-dasharray: 5 4;
    }
    .node.on.kind-group .node-shell {
      fill: color-mix(in srgb, var(--primary) 14%, oklch(16% 0 0 / 0.5));
      stroke: var(--primary);
      stroke-dasharray: 5 4;
    }
    .node-ico {
      overflow: visible;
      pointer-events: none;
      stroke: var(--node-ink);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.78;
    }
    .node.on .node-ico { stroke: var(--primary); opacity: 1; }
    .node.kind-boundary .node-ico { stroke: var(--state-error); opacity: 1; }
    .node.on.kind-boundary .node-ico { stroke: var(--state-error); }
    .node-label {
      font: 500 13px/1.3 var(--font-ui);
      color: var(--node-ink);
      -webkit-text-fill-color: var(--node-ink);
      padding: 8px 8px 8px 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      height: 100%;
      pointer-events: none;
    }
    .node-label .txt {
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .edge {
      fill: none;
      stroke: oklch(72% 0 0 / 0.45);
      stroke-width: 1.4;
      stroke-linejoin: round;
      stroke-linecap: butt;
      pointer-events: none;
    }
    .edge-halo {
      fill: none;
      stroke: var(--lacquer-deep);
      stroke-width: 7;
      stroke-linejoin: round;
      stroke-linecap: butt;
      pointer-events: none;
    }
    .edge.live { stroke: var(--primary); stroke-width: 1.8; }
    .edge.dashed { stroke-dasharray: 5 4; }
    .edge-label {
      fill: #f4f2ee;
      font: 500 11px/1 var(--font-ui);
      pointer-events: none;
      paint-order: stroke fill;
      stroke: var(--lacquer-deep);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .edge-label.live { fill: var(--primary-pale); }
    .token { fill: var(--primary); }
    .inspector {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-left: 1px solid var(--hairline);
      background: var(--raised);
      overflow: hidden;
    }
    .narration-wrap {
      padding: 14px 16px;
      border-bottom: 1px solid var(--hairline);
      overflow: auto;
      min-width: 0;
    }
    .narration {
      overflow-wrap: anywhere;
      color: var(--text);
      line-height: 1.65;
    }
    .fn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.15rem;
      height: 1.15rem;
      margin: 0 0.08em 0 0.22em;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary);
      cursor: pointer;
      vertical-align: -0.18em;
    }
    .fn .ico {
      width: 14px;
      height: 14px;
      display: block;
    }
    .fn[aria-expanded="true"] {
      background: var(--primary);
      color: var(--on-primary);
    }
    .pop code {
      font-size: 0.84em;
    }
    .aside-title {
      display: block;
      margin: 0 0 6px;
      color: var(--primary-pale);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .pop {
      position: fixed;
      z-index: 40;
      width: min(26rem, calc(100vw - 24px));
      max-height: min(42vh, 22rem);
      overflow: auto;
      padding: 12px 14px 14px;
      background: var(--graphite);
      color: var(--text);
      border: 1px solid var(--primary-rule);
      border-radius: var(--r);
      box-shadow: 0 16px 40px oklch(4% 0.004 95 / 0.62);
      font-size: 0.875rem;
      line-height: 1.55;
      overflow-wrap: anywhere;
      user-select: text;
    }
    .pop[hidden] { display: none; }
    .code {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;
      background: var(--lacquer-deep);
    }
    .code-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--graphite);
      border-bottom: 1px solid var(--hairline);
      color: var(--primary-pale);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.04em;
      min-width: 0;
    }
    .code-head .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .code-body {
      margin: 0;
      padding: 8px 0 14px;
      overflow: auto;
      min-height: 0;
      background: oklch(3.5% 0.004 95);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      line-height: 1.6;
    }
    .code-body::-webkit-scrollbar { width: 8px; height: 8px; }
    .code-body::-webkit-scrollbar-thumb { background: color-mix(in oklch, var(--primary) 40%, transparent); border-radius: 2px; }
    .rail::-webkit-scrollbar, .stage::-webkit-scrollbar { width: 8px; height: 8px; }
    .rail::-webkit-scrollbar-thumb, .stage::-webkit-scrollbar-thumb { background: oklch(78% 0 0 / 0.22); border-radius: 2px; }
    .line {
      display: grid;
      grid-template-columns: 3rem minmax(0, 1fr);
      min-width: 0;
    }
    .line:hover { background: var(--primary-soft); }
    .ln {
      color: var(--faint);
      text-align: right;
      padding: 0 12px 0 8px;
      user-select: none;
      font-variant-numeric: tabular-nums;
      border-right: 1px solid var(--hairline);
      margin-right: 12px;
    }
    .lt {
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding-right: 14px;
    }
    .tok-kw { color: var(--primary-pale); }
    .tok-str { color: var(--syn-str); }
    .tok-cmt { color: var(--faint); font-style: italic; }
    .tok-num { color: var(--syn-num); }
    .tok-type { color: var(--syn-type); }
    .step {
      display: grid;
      grid-template-columns: 1.7rem minmax(0, 1fr);
      gap: 8px;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 8px 8px 8px 6px;
      cursor: pointer;
      border-radius: var(--r);
      align-items: center;
    }
    .step:hover { background: color-mix(in srgb, var(--primary) 18%, transparent); }
    .step[aria-current="true"] { background: color-mix(in srgb, var(--primary) 22%, transparent); }
    .step[aria-current="true"]:hover { background: color-mix(in srgb, var(--primary) 38%, transparent); }
    .step .n {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
      line-height: 1.35;
    }
    .step .t { overflow-wrap: anywhere; font-size: 0.875rem; line-height: 1.35; color: var(--text); }
    .repeats {
      display: none;
      padding: 8px 24px;
      font-size: 0.8125rem;
      color: var(--muted);
      border-top: 1px solid var(--hairline);
    }
    .repeats.on { display: block; }
    .notes {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      padding: 14px 24px 20px;
      border-top: 1px solid var(--hairline);
      background: var(--lacquer);
      min-width: 0;
      max-height: 22vh;
      overflow: auto;
    }
    .notes h2 {
      margin: 0 0 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--champagne);
    }
    .notes .note-problem h2 { color: var(--state-warn); }
    .notes h2 .ico {
      width: 16px;
      height: 16px;
      display: block;
    }
    .notes p {
      margin: 0;
      font-size: 0.875rem;
      line-height: 1.55;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    code {
      font-family: var(--font-mono);
      font-size: 0.84em;
      background: var(--primary-soft);
      color: var(--primary-pale);
      padding: 0.05em 0.28em;
      border-radius: 3px;
    }
    .lt code { background: none; color: inherit; padding: 0; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
    @media (max-width: 1100px) {
      body {
        height: auto;
        min-height: 100dvh;
        overflow: auto;
        grid-template-rows: auto;
        padding-bottom: 24px;
      }
      .top { grid-template-columns: minmax(0, 1fr); }
      .transport { flex-wrap: wrap; justify-content: flex-start; }
      .main {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        grid-template-areas:
          "stage inspector"
          "rail rail";
        overflow: visible;
      }
      .stage { grid-area: stage; min-height: 20rem; }
      .inspector {
        grid-area: inspector;
        min-height: 20rem;
        border-left: 1px solid var(--hairline);
      }
      .rail {
        grid-area: rail;
        display: flex;
        flex-direction: row;
        gap: 4px;
        overflow-x: auto;
        border-right: 0;
        border-top: 1px solid var(--hairline);
        padding: 8px 12px 12px;
      }
      .step { flex: 0 0 12rem; }
      svg.flow {
        width: min(100%, 28rem);
        height: auto;
        min-height: 0;
        max-height: 28rem;
      }
      .notes { max-height: none; }
    }
    @media (max-width: 720px) {
      .main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "stage"
          "inspector"
          "rail";
      }
      .inspector { border-left: 0; border-top: 1px solid var(--hairline); }
      .notes { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <p class="kicker" id="pattern"></p>
      <h1 id="title"></h1>
      <p class="thesis" id="thesis"></p>
    </div>
    <div class="transport">
      <div class="accents" role="radiogroup" aria-label="Accent" id="accents">
        <button type="button" data-accent="iris" style="--swatch: oklch(74% 0.12 304)" title="Iris" aria-pressed="true"></button>
        <button type="button" data-accent="glacier" style="--swatch: oklch(76% 0.09 232)" title="Glacier" aria-pressed="false"></button>
        <button type="button" data-accent="dusk" style="--swatch: oklch(72% 0.11 275)" title="Dusk" aria-pressed="false"></button>
      </div>
      <span class="counter" id="counter"></span>
      <button class="ctrl ghost" id="prev" type="button">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13"/></svg>
        <span id="lbl-back">Back</span>
      </button>
      <button class="ctrl ghost" id="next" type="button">
        <span id="lbl-next">Next</span>
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13"/></svg>
      </button>
      <button class="ctrl primary" id="play" type="button"></button>
    </div>
  </header>
  <div class="main">
    <nav class="rail" id="steps" aria-label="Шаги runtime"></nav>
    <section class="stage" aria-label="Схема">
      <p class="stage-label">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/><path d="M7 4.5 H10.5 V9"/></svg>
        <span id="stage-copy">Diagram · node opens a step</span>
      </p>
      <svg class="flow" id="flow" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid meet" role="img"></svg>
    </section>
    <aside class="inspector">
      <div class="narration-wrap">
        <div class="narration" id="narration"></div>
      </div>
      <div class="code" id="code">
        <div class="code-head">
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5 H10 L13 5.5 V13.5 H4 Z"/><path d="M10 2.5 V5.5 H13"/></svg>
          <span class="file" id="code-file"></span>
        </div>
        <div class="code-body" id="code-body"></div>
      </div>
    </aside>
  </div>
  <p class="repeats" id="repeats"></p>
  <footer class="notes">
    <div class="note-problem">
      <h2>
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2 L14.4 13.7 H1.6 Z"/><path d="M8 6.2 V10"/><circle class="fill" cx="8" cy="11.75" r="1.1"/></svg>
        <span id="lbl-problem">The catch</span>
      </h2>
      <p id="problem"></p>
    </div>

      const ids = new Set(nodes.map((n) => n.id));
      const out = Object.fromEntries(nodes.map((n) => [n.id, 0]));
      const inn = Object.fromEntries(nodes.map((n) => [n.id, 0]));
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        if (!ids.has(e.from) || !ids.has(e.to) || e.from === e.to) return false;
        out[e.from] += 1;
        inn[e.to] += 1;
      }
      const sources = nodes.filter((n) => inn[n.id] === 0);
      const sinks = nodes.filter((n) => out[n.id] === 0);
      if (sources.length !== 1 || sinks.length !== 1) return false;
      return nodes.every((n) => out[n.id] <= 1 && inn[n.id] <= 1);
    }

    function placeRow(row, li, boxW, boxH, gapX, gapY, padY, canvasW) {
      const rowW = row.length * boxW + Math.max(0, row.length - 1) * gapX;
      const startX = Math.max(24, (canvasW - rowW) / 2);
      return row.map((n, idx) => ({
        ...n,
        x: startX + idx * (boxW + gapX),
        y: padY + li * (boxH + gapY),
        w: boxW,
        h: boxH
      }));
    }

    function layoutTimeline(nodes) {
      const boxW = 280, boxH = 44, gapY = 28, pad = 24, x = 48;
      return nodes.map((n, idx) => ({ ...n, x, y: pad + idx * (boxH + gapY), w: boxW, h: boxH }));
    }

    function layoutGrouped(nodes, keyFn) {
      const groups = new Map();
      nodes.forEach((n) => {
        const L = keyFn(n);
        if (!groups.has(L)) groups.set(L, []);
        groups.get(L).push(n);
      });
      const boxW = 188, boxH = 52, gapX = 28, gapY = 88, padY = 28;
      const layers = [...groups.keys()].sort((a, b) => a - b);
      const maxCount = Math.max(1, ...layers.map((L) => groups.get(L).length));
      const width = 48 + maxCount * boxW + (maxCount - 1) * gapX;
      return layers.flatMap((L, li) => placeRow(groups.get(L), li, boxW, boxH, gapX, gapY, padY, width));
    }

    function layoutLayers(nodes) {
      const LAYER = {
        provider: 0, host: 0, cloud: 0,
        frame: 1, hoc: 1,
        process: 1, other: 1, start: 1, queue: 1, subroutine: 1,
        inbox: 2, consumer: 2, action: 2, decision: 2,
        child: 3, file: 3, folder: 3, boundary: 3, group: 0, junction: 2
      };
      return layoutGrouped(nodes, (n) => LAYER[n.kind] ?? 1);
    }

    function layoutRanked(nodes) {
      return layoutGrouped(nodes, (n) => Number(n.rank));
    }

    function layoutDag(nodes, edges) {
      const ids = new Set(nodes.map((n) => n.id));
      const incoming = Object.fromEntries(nodes.map((n) => [n.id, 0]));
      const outs = Object.fromEntries(nodes.map((n) => [n.id, []]));
      edges.forEach((e) => {
        if (!ids.has(e.from) || !ids.has(e.to)) return;
        incoming[e.to] += 1;
        outs[e.from].push(e.to);
      });
      const indeg = { ...incoming };
      const rank = Object.fromEntries(nodes.map((n) => [n.id, 0]));
      const queue = nodes.filter((n) => incoming[n.id] === 0).map((n) => n.id);
      const seen = new Set();
      while (queue.length) {
        const id = queue.shift();
        if (seen.has(id)) continue;
        seen.add(id);
        (outs[id] || []).forEach((to) => {
          rank[to] = Math.max(rank[to], rank[id] + 1);
          incoming[to] -= 1;
          if (incoming[to] === 0) queue.push(to);
        });
      }
      const ordered = [...nodes].sort((a, b) => {
        const d = (rank[a.id] || 0) - (rank[b.id] || 0);
        if (d) return d;
        return (indeg[b.id] || 0) - (indeg[a.id] || 0);
      });
      return layoutGrouped(ordered, (n) => rank[n.id] || 0);
    }

    function layoutTree(nodes) {
      const kids = Object.fromEntries(nodes.map((n) => [n.id, []]));
      const roots = [];
      nodes.forEach((n) => {
        if (n.parent && kids[n.parent]) kids[n.parent].push(n);
        else roots.push(n);
      });
      const boxW = 228, boxH = 36, gapY = 10, indent = 28, pad = 24;
      const out = [];
      let y = pad;
      function walk(n, depth) {
        out.push({ ...n, x: pad + depth * indent, y, w: boxW, h: boxH });
        y += boxH + gapY;
        (kids[n.id] || []).forEach((c) => walk(c, depth + 1));
      }
      roots.forEach((r) => walk(r, 0));
      return out;
    }

    function layoutContainers(nodes, edges) {
      const groupIds = new Set(nodes.filter((n) => kindOf(n) === "group").map((n) => n.id));
      const kids = {};
      groupIds.forEach((id) => { kids[id] = []; });
      const outer = [];
      nodes.forEach((n) => {
        if (kindOf(n) === "group") return;
        if (n.parent && groupIds.has(n.parent)) kids[n.parent].push(n);
        else outer.push(n);
      });
      const boxW = 168, boxH = 48, gapX = 16, gapY = 16, padX = 16, padY = 30;
      const placed = [];
      let gx = 24, gy = 24, rowH = 0;
      nodes.filter((n) => kindOf(n) === "group").forEach((g) => {
        const list = kids[g.id] || [];
        const folderish = list.length && list.every((k) => k.kind === "folder" || k.kind === "file");
        const cols = folderish ? 1 : Math.min(3, Math.max(1, list.length));
        const rows = Math.max(1, Math.ceil(list.length / cols) || 1);
        const gw = padX * 2 + cols * boxW + Math.max(0, cols - 1) * gapX;
        const gh = padY + 14 + rows * boxH + Math.max(0, rows - 1) * gapY;
        if (gx > 24 && gx + gw > 720) {
          gx = 24;
          gy += rowH + 28;
          rowH = 0;
        }
        list.forEach((k, i) => {
          const col = i % cols, row = Math.floor(i / cols);
          placed.push({
            ...k,
            x: gx + padX + col * (boxW + gapX),
            y: gy + padY + row * (boxH + gapY),
            w: boxW,
            h: boxH
          });
        });
        placed.push({ ...g, x: gx, y: gy, w: gw, h: gh });
        gx += gw + 28;
        rowH = Math.max(rowH, gh);
      });
      if (outer.length) {
        const rest = layoutDag(outer, edges).map((n) => ({ ...n, y: n.y + gy + rowH + 36 }));
        return placed.concat(rest);
      }
      return placed;
    }

    function layoutNodes(nodes, edges) {
      const mode = LESSON.layout || "auto";
      const treeish = nodes.length && nodes.every((n) => n.kind === "folder" || n.kind === "file");
      if (mode === "tree" || (mode === "auto" && treeish)) return layoutTree(nodes);
      if (nodes.some((n) => kindOf(n) === "group")) return layoutContainers(nodes, edges);
      if (mode === "timeline" || (mode === "auto" && isChain(nodes, edges))) return layoutTimeline(nodes);
      if (nodes.some((n) => Number.isFinite(n.rank))) return layoutRanked(nodes);
      if (mode === "layers") return layoutLayers(nodes);
      return layoutDag(nodes, edges);
    }

    function center(n) { return { x: n.x + n.w / 2, y: n.y + n.h / 2 }; }

    function edgeCardinal(from, to) {
      const a = center(from);
      const b = center(to);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const splitRow = Math.abs(from.y - to.y) > Math.min(from.h, to.h) * 0.5;
      if (splitRow) return dy > 0 ? "bottom" : "top";
      if (Math.abs(dx) > Math.abs(dy) * 1.15) return dx > 0 ? "right" : "left";
      return dy > 0 ? "bottom" : "top";
    }

    function pointOnSide(n, side, k, count) {
      const t = count <= 1 ? 0.5 : (k + 1) / (count + 1);
      if (side === "bottom") return { x: n.x + n.w * t, y: n.y + n.h };
      if (side === "top") return { x: n.x + n.w * t, y: n.y };
      if (side === "right") return { x: n.x + n.w, y: n.y + n.h * t };
      return { x: n.x, y: n.y + n.h * t };
    }

    function fanPorts(nodes, edges) {
      const pos = Object.fromEntries(nodes.map((n) => [n.id, n]));
      const buckets = {};
      const add = (id, side, item) => {
        const key = id + "\t" + side;
        if (!buckets[key]) buckets[key] = [];
        buckets[key].push(item);
      };
      edges.forEach((e, i) => {
        if (e.via) return;
        const a = pos[e.from];
        const b = pos[e.to];
        if (!a || !b) return;
        add(e.from, edgeCardinal(a, b), { i, other: b, end: "from" });
        add(e.to, edgeCardinal(b, a), { i, other: a, end: "to" });
      });
      const fromP = [];
      const toP = [];
      Object.keys(buckets).forEach((key) => {
        const tab = key.indexOf("\t");
        const n = pos[key.slice(0, tab)];
        const side = key.slice(tab + 1);
        const list = buckets[key];
        const horiz = side === "top" || side === "bottom";
        list.sort((A, B) => (horiz ? A.other.x - B.other.x : A.other.y - B.other.y));
        list.forEach((item, k) => {
          const pt = pointOnSide(n, side, k, list.length);
          if (item.end === "from") fromP[item.i] = pt;
          else toP[item.i] = pt;
        });
      });
      return { fromP, toP };
    }

    function lanePlan(edges, fromP, toP, pos) {
      const items = [];
      edges.forEach((e, i) => {
        const a = pos[e.from], b = pos[e.to];
        if (!a || !b || !fromP[i] || !toP[i]) return;
        if (Math.abs(a.y - b.y) <= Math.min(a.h, b.h) * 0.5) return;
        items.push({ i, x: fromP[i].x });
      });
      items.sort((A, B) => A.x - B.x);
      const laneOf = {};
      items.forEach((it, k) => { laneOf[it.i] = k; });
      return { laneOf, count: Math.max(1, items.length) };
    }

    function orthoPath(a, b, p, q, lane, laneCount) {
      if (Math.abs(p.x - q.x) < 1.5) {
        return { d: `M ${p.x} ${p.y} L ${q.x} ${q.y}`, lx: p.x + 10, ly: (p.y + q.y) / 2 + 3, vertical: true };
      }
      if (Math.abs(p.y - q.y) < 1.5) {
        return { d: `M ${p.x} ${p.y} L ${q.x} ${q.y}`, lx: (p.x + q.x) / 2, ly: p.y - 8, vertical: false };
      }
      const t = laneCount > 1 ? (lane + 1) / (laneCount + 1) : 0.5;
      const midY = p.y + (q.y - p.y) * t;
      if (Math.abs(a.y - b.y) >= Math.abs(a.x - b.x) * 0.35) {
        return {
          d: `M ${p.x} ${p.y} L ${p.x} ${midY} L ${q.x} ${midY} L ${q.x} ${q.y}`,
          lx: p.x + 10,
          ly: (p.y + midY) / 2 + 3,
          vertical: true
        };
      }
      const midX = (p.x + q.x) / 2;
      return {
        d: `M ${p.x} ${p.y} L ${midX} ${p.y} L ${midX} ${q.y} L ${q.x} ${q.y}`,
        lx: midX + 10,
        ly: (p.y + q.y) / 2 + 3,
        vertical: true
      };
    }

    function nudgeLabel(x, y, text, placed) {
      const w = Math.min(150, 6.2 * String(text).length + 8);
      const h = 14;
      let ly = y;
      let guard = 0;
      while (guard++ < 8) {
        const hit = placed.some((p) => Math.abs(p.x - x) < (p.w + w) / 2 && Math.abs(p.y - ly) < h);
        if (!hit) break;
        ly += 13;
      }
      placed.push({ x, y: ly, w, h });
      return ly;
    }

    function nodeShell(n) {
      const { x, y, w, h } = n;
      const k = kindOf(n);
      if (k === "group") {
        return `<rect class="node-shell" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>`;
      }
      if (k === "start" || k === "queue" || k === "cloud") {
        return `<rect class="node-shell" x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(h / 2, 22)}"/>`;
      }
      if (k === "decision") {
        const cx = x + w / 2, cy = y + h / 2;
        return `<polygon class="node-shell" points="${cx},${y} ${x + w},${cy} ${cx},${y + h} ${x},${cy}"/>`;
      }
      if (k === "junction") {
        const rr = Math.min(w, h) / 2 - 2;
        return `<circle class="node-shell" cx="${x + w / 2}" cy="${y + h / 2}" r="${rr}"/>`;
      }
      return `<rect class="node-shell" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>`;
    }

    function renderNode(n, live) {
      const on = live.has(n.id) ? "on" : "";
      const k = kindOf(n);
      const group = k === "group";
      const icoY = group ? n.y + 8 : n.y + (n.h - 16) / 2;
      const foY = group ? n.y + 2 : n.y;
      const foH = group ? 22 : n.h;
      const label = n.label
        ? `<foreignObject x="${n.x + 26}" y="${foY}" width="${n.w - 30}" height="${foH}" color="#f4f2ee">
            <div xmlns="http://www.w3.org/1999/xhtml" class="node-label" style="color:#f4f2ee;-webkit-text-fill-color:#f4f2ee"><span class="txt">${escapeHtml(n.label)}</span></div>
          </foreignObject>`
        : "";
      return `<g class="node ${on} kind-${escapeHtml(k)}" data-id="${n.id}">
        ${nodeShell(n)}
        <svg class="node-ico" x="${n.x + 8}" y="${icoY}" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">${glyph(k)}</svg>
        ${label}
        <rect class="hit" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" fill="transparent"></rect>
      </g>`;
    }

    function edgeMarks(e, liveEdge) {
      const ek = e.kind || "flow";
      const live = liveEdge ? " live" : "";
      const dash = ek === "dashed" ? " dashed" : "";
      const tip = liveEdge ? "arrow-live" : "arrow";
      const start = (ek === "back" || ek === "both") ? ` marker-start="url(#${tip}-rev)"` : "";
      const end = ek === "back" ? "" : ` marker-end="url(#${tip})"`;
      return { cls: `edge${live}${dash}`, start, end };
    }

    function renderFlow(highlight) {
      const nodes = layoutNodes(LESSON.nodes || [], LESSON.edges || []);
      const pos = Object.fromEntries(nodes.map((n) => [n.id, n]));
      const maxX = Math.max(420, ...nodes.map((n) => n.x + n.w + 48));
      const maxY = Math.max(240, ...nodes.map((n) => n.y + n.h + 36));
      const svg = $("flow");
      svg.setAttribute("viewBox", `0 0 ${maxX} ${maxY}`);
      svg.style.aspectRatio = `${maxX} / ${maxY}`;
      const live = new Set(highlight || []);
      const marks = `<defs>
        <style>
          .node-label, .node-label .txt {
            color: #f4f2ee !important;
            -webkit-text-fill-color: #f4f2ee !important;
            font-family: "Albert Sans", "Avenir Next", "Segoe UI", sans-serif;
          }
        </style>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="oklch(82% 0 0 / 0.85)"></path>
        </marker>
        <marker id="arrow-live" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--primary)"></path>
        </marker>
        <marker id="arrow-rev" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 10 0 L 0 5 L 10 10 z" fill="oklch(82% 0 0 / 0.85)"></path>
        </marker>
        <marker id="arrow-live-rev" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 10 0 L 0 5 L 10 10 z" fill="var(--primary)"></path>
        </marker>
      </defs>`;
      const { fromP, toP } = fanPorts(nodes, LESSON.edges || []);
      const { laneOf, count: laneCount } = lanePlan(LESSON.edges || [], fromP, toP, pos);
      const placed = [];
      const edgeEls = [];
      const labelEls = [];
      (LESSON.edges || []).forEach((e, ei) => {
        const a = pos[e.from];
        const b = pos[e.to];
        if (!a || !b) return;
        const mid = e.via && pos[e.via];
        let d, lx, ly, vertical;
        if (mid) {
          const p = { x: a.x + a.w / 2, y: a.y + a.h };
          const q = { x: b.x + b.w / 2, y: b.y };
          const m = { x: mid.x + mid.w / 2, y: mid.y + mid.h / 2 };
          d = `M ${p.x} ${p.y} L ${m.x} ${m.y} L ${q.x} ${q.y}`;
          lx = m.x + 10; ly = m.y - 6; vertical = false;
        } else {
          if (!fromP[ei] || !toP[ei]) return;
          ({ d, lx, ly, vertical } = orthoPath(a, b, fromP[ei], toP[ei], laneOf[ei] || 0, laneCount));
        }
        const liveEdge = live.has(e.from) && live.has(e.to);
        const mk = edgeMarks(e, liveEdge);
        const token = liveEdge
          ? `<circle r="4" class="token"><animateMotion dur="1.6s" repeatCount="indefinite" path="${d}" /></circle>`
          : "";
        edgeEls.push(`<path class="edge-halo" d="${d}"></path><path class="${mk.cls}"${mk.start}${mk.end} d="${d}"></path>${token}`);
        if (e.label) {
          const y = nudgeLabel(lx, ly, e.label, placed);
          labelEls.push(`<text class="edge-label${liveEdge ? " live" : ""}" x="${lx}" y="${y}" fill="#f4f2ee" text-anchor="${vertical ? "start" : "middle"}">${escapeHtml(e.label)}</text>`);
        }
      });
      const groupEls = nodes.filter((n) => kindOf(n) === "group").map((n) => renderNode(n, live)).join("");
      const nodeEls = nodes.filter((n) => kindOf(n) !== "group").map((n) => renderNode(n, live)).join("");
      svg.innerHTML = marks + groupEls + edgeEls.join("") + nodeEls + labelEls.join("");
      svg.querySelectorAll(".node").forEach((el) => {
        el.addEventListener("click", () => {
          const id = el.getAttribute("data-id");
          const stepIdx = stepForNode(id);
          if (stepIdx >= 0) show(stepIdx);
        });
      });
    }

    function stepForNode(id) {
      const steps = LESSON.steps || [];
      const direct = steps.findIndex((s) => (s.highlight || []).includes(id));
      if (direct >= 0) return direct;
      const neigh = new Set();
      (LESSON.edges || []).forEach((e) => {
        if (e.from === id) neigh.add(e.to);
        if (e.to === id) neigh.add(e.from);
      });
      return steps.findIndex((s) => (s.highlight || []).some((h) => neigh.has(h)));
    }

    function show(index) {
      const steps = LESSON.steps || [];
      if (!steps.length) return;
      closePop();
      i = (index + steps.length) % steps.length;
      const step = steps[i];
      $("counter").textContent = `${i + 1} / ${steps.length}`;
      $("prev").disabled = i === 0 && !timer;
      $("next").disabled = i === steps.length - 1 && !timer;
      renderRich($("narration"), step.narration || "");
      const file = (step.code && step.code.file) || "";
      const start = step.code && step.code.startLine ? `:${step.code.startLine}` : "";
      $("code-file").textContent = file + start;
      renderCode((step.code && step.code.text) || "", step.code && step.code.startLine);
      [...document.querySelectorAll(".step")].forEach((btn, idx) => {
        if (idx === i) btn.setAttribute("aria-current", "true");
        else btn.removeAttribute("aria-current");
      });
      renderFlow(step.highlight || []);
    }

    function play() {
      if (timer) {
        clearInterval(timer);
        timer = null;
        setPlay(false);
        show(i);
        return;
      }
      setPlay(true);
      $("prev").disabled = false;
      $("next").disabled = false;
      timer = setInterval(() => show(i + 1), 2400);
    }

    function boot() {
      if (!LESSON || typeof LESSON !== "object") {
        document.body.innerHTML = "<p>LESSON JSON was not injected (__LESSON_JSON__).</p>";
        return;
      }
      const t = ui();
      document.documentElement.lang = String(LESSON.lang || "en").slice(0, 2);
      $("accents").setAttribute("aria-label", t.accent);
      $("lbl-back").textContent = t.back;
      $("lbl-next").textContent = t.next;
      $("stage-copy").textContent = t.stage;
      $("lbl-problem").textContent = t.problem;
      $("lbl-why").textContent = t.why;
      $("lbl-cost").textContent = t.cost;
      $("steps").setAttribute("aria-label", t.steps);
      const defaultAccent = LESSON.accent || KIND_ACCENT[LESSON.kind] || "iris";
      applyAccent(defaultAccent);
      $("accents").addEventListener("click", (ev) => {
        const btn = ev.target.closest("[data-accent]");
        if (btn) applyAccent(btn.dataset.accent);
      });
      setPlay(false);
      renderRich($("pattern"), LESSON.pattern || "Lesson");
      renderRich($("title"), LESSON.title || "Lesson");
      document.title = (LESSON.title || "You Don't Know").replace(/`/g, "");
      renderRich($("thesis"), LESSON.thesis || "");
      renderRich($("problem"), LESSON.problem || "");
      renderRich($("whyNotBasic"), LESSON.whyNotBasic || "");
      renderRich($("cost"), LESSON.cost || "");
      const repeats = LESSON.repeats || [];
      if (repeats.length) {
        $("repeats").classList.add("on");
        renderRich($("repeats"), "Также здесь: " + repeats.map((r) => `${r.module} (${r.file}) — ${r.note}`).join(" · "));
      }
      $("steps").innerHTML = (LESSON.steps || []).map((s, idx) =>
        `<button class="step" type="button" data-i="${idx}"><span class="n">${pad(idx)}</span><span class="t"></span></button>`
      ).join("");
      [...$("steps").querySelectorAll(".step")].forEach((btn, idx) => {
        renderRich(btn.querySelector(".t"), (LESSON.steps[idx] && LESSON.steps[idx].title) || "");
      });
      $("steps").addEventListener("click", (ev) => {
        const btn = ev.target.closest("[data-i]");
        if (btn) show(Number(btn.dataset.i));
      });
      $("play").onclick = play;
      $("prev").onclick = () => show(i - 1);
      $("next").onclick = () => show(i + 1);
      document.addEventListener("click", (ev) => {
        const pop = $("pop");
        if (pop.hidden) return;
        if (pop.contains(ev.target) || ev.target.closest(".fn")) return;
        closePop();
      });
      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape") {
          if (!$("pop").hidden) { ev.preventDefault(); closePop(); }
          return;
        }
        if (ev.key === " ") { ev.preventDefault(); play(); }
        if (ev.key === "ArrowRight") show(i + 1);
        if (ev.key === "ArrowLeft") show(i - 1);
      });
      window.addEventListener("resize", closePop);
      show(0);
    }

    boot();
  </script>
</body>
</html>
